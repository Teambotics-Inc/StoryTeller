<style>:root{--bg:#ffffff;--surface:#f6f6f6;--text:#262626;--muted:#6e6e6e;--line:rgba(0,0,0,0.16);--accent:#0074c0;color-scheme:light}</style>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.45;display:flex;flex-direction:column;height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:18px 24px 14px;border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{max-height:30px;max-width:120px;display:block}
.wordmark{margin:0;font-size:19px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.dek{margin:6px 0 0;max-width:640px;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{min-height:36px;padding:0 12px;border:1px solid color-mix(in srgb,var(--text) 22%,transparent);background:color-mix(in srgb,var(--bg) 88%,var(--text));text-transform:uppercase;letter-spacing:.1em;font-size:10px;transition:border-color .15s,color .15s,background .15s}
.btn:hover,.btn[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 24px;border-bottom:1px solid var(--line);flex:none}
.search{display:flex;align-items:center;gap:8px;min-width:220px;height:34px;padding:0 10px;border:1px solid color-mix(in srgb,var(--text) 22%,transparent);background:color-mix(in srgb,var(--bg) 88%,var(--text));color:var(--muted)}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--text);font-size:12px}
.search input::placeholder{color:var(--muted);opacity:.8}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:28px;padding:0 10px;border:1px solid color-mix(in srgb,var(--text) 22%,transparent);background:none;color:var(--muted);font-size:11px;display:inline-flex;align-items:center;gap:6px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent));display:inline-block}
.chip:hover{color:var(--text)}
.chip[aria-pressed=true]{background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:var(--accent);color:var(--accent)}
.stories{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-left:auto}
.stories>span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

main{position:relative;flex:1;min-height:0}
#graph{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#graph.dragging{cursor:grabbing}
.edge{stroke:var(--text);stroke-opacity:.34;stroke-width:1.2;vector-effect:non-scaling-stroke;transition:stroke-opacity .18s,stroke .18s}
.edge.inferred{stroke-dasharray:3 5;stroke-opacity:.42}
.edge.hl{stroke:var(--accent);stroke-opacity:1;stroke-width:2.2;stroke-dasharray:none}
.edge.inferred.hl{stroke-dasharray:6 5}
.edge.dim{stroke-opacity:.05}
.edge-label{font-size:10px;fill:var(--accent);text-anchor:middle;opacity:0;pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.edge-label.hl{opacity:1}
.node{cursor:pointer;transition:opacity .18s}
.node .core{fill:var(--bg);stroke-width:2;transition:stroke-width .15s}
.node.root .core{stroke-width:0}
.node .dot{opacity:.9}
.node .label{font-size:calc(11px * var(--ls,1));fill:var(--text);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.node.root .label{font-weight:700;letter-spacing:.2em;font-size:12px}
.node .kind{font-size:7.5px;fill:var(--muted);text-anchor:middle;letter-spacing:.14em;text-transform:uppercase;paint-order:stroke;stroke:var(--bg);stroke-width:3px;pointer-events:none;opacity:0;transition:opacity .15s}
#graph.zoomed .node .kind{opacity:1}
.node:hover .core,.node:focus-visible .core{stroke-width:3.5}
.node:focus-visible{outline:none}
.node:focus-visible .ring{opacity:1}
.ring{fill:none;stroke:var(--accent);stroke-width:2;opacity:0}
.node.sel .ring{opacity:1}
.node.dim{opacity:.16}
.badge circle{fill:var(--accent)}
.badge text{fill:var(--bg);font-size:9px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.story-path{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 7;vector-effect:non-scaling-stroke;opacity:.85}

.zoom.right{left:auto;right:20px}
.zoom{position:absolute;left:20px;bottom:92px;display:flex;flex-direction:column;gap:6px}
.zoom .btn{width:36px;padding:0;font-size:16px;letter-spacing:0}
.foot{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 24px;padding:10px 24px;font-size:11px;color:var(--muted);pointer-events:none;background:linear-gradient(to top,var(--bg) 40%,transparent)}
.foot p{margin:0}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:flex-end}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.legend svg{width:22px;height:8px}
.empty{position:absolute;inset:0;display:none;place-items:center;color:var(--muted);pointer-events:none}
.empty.on{display:grid}

#list{padding:20px 24px 80px}
#list section{max-width:860px;margin:0 auto 26px}
#list h2{margin:0 0 10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
#list h2 i{width:9px;height:9px;border-radius:50%;background:var(--c)}
#list ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item{display:block;width:100%;text-align:left;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c)}
.item:hover,.item:focus-visible{border-color:var(--c)}
.item b{display:block;font-weight:600}
.item small{color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-size:10px}
.item span{display:block;color:var(--muted);margin-top:4px;font-size:13px}

.views{display:flex;border:1px solid color-mix(in srgb,var(--text) 22%,transparent);flex:none}
.views button{min-height:34px;padding:0 12px;border:0;border-right:1px solid color-mix(in srgb,var(--text) 22%,transparent);background:none;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.views button:last-child{border-right:0}
.views button:hover{color:var(--text)}
.views button[aria-pressed=true]{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.pane{position:absolute;inset:0;overflow:auto;display:none}
.pane.on{display:block}

#timeline{overflow-x:hidden;overflow-y:auto}
#tl{display:block;width:100%;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.tl-mode{position:absolute;top:8px;right:16px;z-index:2}
.tl-lane{fill:var(--text);opacity:.04}
.tl-lane.alt{opacity:.015}
.tl-lane-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;fill:var(--muted)}
.tl-tick{stroke:var(--line);stroke-dasharray:2 5}
.tl-tick-label{font-size:10px;fill:var(--muted);text-anchor:middle}
.tl-node{cursor:pointer}
.tl-node text{font-size:11px;fill:var(--text);paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round}
.tl-node .tl-when{font-size:9px;fill:var(--muted)}
.tl-node .tl-dot{stroke:var(--bg);stroke-width:1.5}
.tl-node.sel .tl-dot{stroke:var(--accent);stroke-width:3}
.tl-node:focus-visible{outline:none}
.tl-node:focus-visible .tl-dot{stroke:var(--accent);stroke-width:3}
.tl-node.dim{opacity:.18}
.tl-bar{opacity:.5}

#read{padding:28px 24px 140px}
.read-wrap{max-width:720px;margin:0 auto}
.read-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:26px}
.read-wrap h2.rt{font-size:30px;line-height:1.15;margin:0 0 10px}
.read-wrap .intro{color:var(--muted);font-size:16px;margin:0 0 34px}
.rstep{position:relative;padding:0 0 34px 54px}
.rstep::before{content:"";position:absolute;left:15px;top:36px;bottom:2px;width:1px;background:var(--line)}
.rstep:last-child::before{display:none}
.rnum{position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--c,var(--accent));color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px}
.rstep .via{font-size:12px;color:var(--muted);margin:0 0 6px}
.rstep .via em{font-style:normal;color:var(--accent)}
.rstep h3{margin:0 0 2px;font-size:21px;line-height:1.25}
.rstep h3 button{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit}
.rstep h3 button:hover{color:var(--accent)}
.rstep .meta{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.rstep p{margin:0 0 10px;font-size:15px}
.rstep .details{color:var(--muted)}
.rstep blockquote{margin:0 0 12px;padding:8px 12px;border-left:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);font-size:14px}
.rstep .rsrc{font-size:12px;color:var(--muted)}
.rstep .rsrc a{color:var(--accent)}

#outline{padding:22px 24px 110px}
.ol-wrap{max-width:880px;margin:0 auto}
.ol-tools{display:flex;gap:8px;margin-bottom:16px}
.ol-wrap ul{list-style:none;margin:0;padding:0 0 0 22px;border-left:1px solid var(--line)}
.ol-wrap>ul{border-left:0;padding-left:0}
.ol-wrap li{margin:2px 0}
.ol-wrap li.dim{opacity:.35}
.ol-wrap .row{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding:6px 6px;list-style:none}
.ol-wrap summary.row{cursor:pointer}
.ol-wrap summary::-webkit-details-marker{display:none}
.ol-wrap summary.row::before{content:"+";color:var(--muted);width:12px;flex:none}
.ol-wrap details[open]>summary.row::before{content:"\2212"}
.ol-wrap .row i{width:9px;height:9px;border-radius:50%;background:var(--c);align-self:center;flex:none}
.ol-wrap .via{font-size:11px;color:var(--accent)}
.ol-wrap .olt{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--text);text-align:left}
.ol-wrap .olt:hover{color:var(--accent)}
.ol-wrap small{color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.ol-wrap .olcount{margin-left:auto;font-size:11px;color:var(--muted)}
.ol-wrap .olbody{padding:0 6px 8px 26px;color:var(--muted);font-size:13px}
.ol-wrap .olbody p{margin:0 0 4px}
.ol-wrap .olink{background:none;border:0;padding:0;font:inherit;font-size:12px;color:var(--accent);text-align:left}
.ol-wrap .olink:hover{text-decoration:underline}
@media (max-width:760px){.views{width:100%;overflow-x:auto}.views button{flex:1 0 auto;padding:0 10px}#read{padding:20px 16px 150px}.rstep{padding-left:46px}.tl-mode{right:10px}#outline{padding:16px 14px 110px}}

#panel{position:absolute;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:22px 22px 40px;transform:translateX(102%);transition:transform .25s ease,visibility 0s linear .25s;z-index:6;box-shadow:-12px 0 40px rgba(0,0,0,.25)}
#panel.open{transform:none;visibility:visible;transition:transform .25s ease,visibility 0s}
#panel:not(.open){box-shadow:none;visibility:hidden}
#panel .close{position:absolute;top:10px;right:10px;width:32px;height:32px;border:0;background:none;color:var(--muted);font-size:20px}
#panel .close:hover{color:var(--accent)}
#panel .kicker{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#panel .kicker i{width:9px;height:9px;border-radius:50%;background:var(--c)}
#panel h2{margin:8px 28px 10px 0;font-size:22px;line-height:1.2;overflow-wrap:anywhere}
#panel p{margin:0 0 12px}
#panel .details{color:var(--muted)}
#panel h3{margin:20px 0 8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
#panel blockquote{margin:0 0 12px;padding:8px 12px;border-left:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:2px 8px;border:1px solid var(--line);font-size:11px;color:var(--muted)}
.links{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.links button{width:100%;text-align:left;background:none;border:1px solid var(--line);padding:8px 10px;display:grid;gap:2px}
.links button:hover{border-color:var(--accent)}
.links .rel{font-size:11px;color:var(--muted)}
.links .rel em{font-style:normal;color:var(--accent)}
.src{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.src a{color:var(--accent);text-decoration:none;overflow-wrap:anywhere}
.src a:hover{text-decoration:underline}
.src small{display:block;color:var(--muted)}

#storybar{z-index:7;position:absolute;left:50%;bottom:54px;transform:translateX(-50%);width:min(560px,calc(100% - 32px));background:var(--surface);border:1px solid var(--accent);padding:10px 14px;display:none;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;z-index:5;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#storybar.on{display:grid}
#storybar .t{min-width:0}
#storybar b{display:block;font-size:13px}
#storybar span{display:block;color:var(--muted);font-size:12px}
#storybar .step{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
#storybar .nav{display:flex;gap:6px}
#storybar .btn{padding:0 10px}

noscript{display:block;padding:24px;max-width:760px}

@media (max-width:760px){
  header{padding:14px 16px 10px;flex-direction:column}
  .actions{justify-content:flex-start}
  .toolbar{padding:8px 16px}
  .stories{margin-left:0;width:100%}
  .search{flex:1 1 100%}
  .chips,.stories{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none;padding-bottom:2px}
  .chips::-webkit-scrollbar,.stories::-webkit-scrollbar{display:none}
  .chip,.stories>span{flex:none;white-space:nowrap}
  .dek{font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  header{flex-direction:row;flex-wrap:wrap}
  .legend,#status{display:none}
  .wordmark{font-size:16px}
  .actions .btn{min-height:30px;padding:0 9px}
  .zoom{bottom:70px}
  .toolbar{gap:6px}
  .foot{font-size:10px}
  .foot{padding:8px 16px}
  .legend{justify-content:flex-start}
  .zoom{left:12px}
  #panel{top:auto;width:100%;height:58%;border-left:0;border-top:1px solid var(--line);transform:translateY(102%)}
  #panel.open{transform:none}
  #storybar{bottom:68px;grid-template-columns:1fr;}
  main.sheet #storybar{bottom:calc(58% + 10px)}
  #list{padding:14px 16px 90px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<noscript><h1>Philip Morris International</h1><p>PMI says it is building a future without cigarettes. This map sets that vision beside what regulators, health bodies and its own numbers show.</p><p>This interactive story graph needs JavaScript. The full content follows.</p><ul><li><strong>Philip Morris International</strong>: The cigarette maker that sells Marlboro outside the US and says its purpose is now to replace cigarettes with smoke-free alternatives.</li><li><strong>Bond Street shop, 1847</strong>: The company’s own account of where it starts: a tobacconist’s shop in London, long before the US cigarette brands.</li><li><strong>Part of Philip Morris Cos.</strong>: PMI began as the international operating arm of a US parent, which later renamed itself Altria.</li><li><strong>Lausanne operations centre</strong>: PMI moved its operations centre from the US to Switzerland, where it still runs global operations.</li><li><strong>Spun off from Altria, 2008</strong>: PMI became an independent public company, leaving the US cigarette business with Altria and taking the rest of the world.</li><li><strong>Marlboro</strong>: The flagship cigarette brand. PMI sells it everywhere except the US, where Altria’s Philip Morris USA does.</li><li><strong>When was Marlboro born?</strong>: PMI dates the Marlboro trademark to 1908; Wikipedia says the brand was introduced in 1924. This map shows both rather than choosing.</li><li><strong>World’s best-selling cigarette</strong>: By PMI’s account Marlboro reached the top of global cigarette sales in 1972 and stayed there as the company’s anchor.</li><li><strong>“All cigarettes are harmful”</strong>: PMI’s own health page states plainly that cigarettes are harmful and addictive, including the brands it sells.</li><li><strong>One billion smokers</strong>: The premise of the pivot: PMI argues the number of smokers is not expected to fall soon, so people who don’t quit need an alternative.</li><li><strong>The smoke-free vision</strong>: In 2016 PMI announced it would shift resources to smoke-free products, with the aim that they one day replace cigarettes.</li><li><strong>“Not risk-free”</strong>: PMI’s vision is hedged: the products it promotes are described as better than smoking, not harmless, and they contain nicotine.</li><li><strong>Two-thirds smoke-free by 2030</strong>: A numeric target that turns the vision into something measurable: most revenue from non-cigarette products by 2030.</li><li><strong>42% smoke-free, H1 2026</strong>: PMI’s latest reported progress against the 2030 ambition: a little over two-fifths of net revenues from smoke-free products.</li><li><strong>Jacek Olczak</strong>: A PMI lifer who became CEO in 2021 and Group CEO in 2026, the executive most associated with the transformation and the Swedish Match deal.</li><li><strong>Neuchâtel R&amp;D centre</strong>: The Swiss research facility PMI built for smoke-free products, years before it announced the vision publicly.</li><li><strong>US$16 billion on R&amp;D</strong>: PMI’s stated investment in smoke-free products since 2008, with a team of more than 1,600 scientists, engineers and technicians.</li><li><strong>IQOS pilot, 2014</strong>: PMI’s first heat-not-burn platform goes into trial markets in Italy and Japan.</li><li><strong>IQOS launches in Europe, 2015</strong>: A first wider rollout in selected cities, a year before the smoke-free vision was announced.</li><li><strong>IQOS heated tobacco</strong>: A device that heats tobacco sticks instead of burning them, PMI’s lead smoke-free product and the core of its case for “switching”.</li><li><strong>“95% lower harmful chemicals”</strong>: PMI’s headline number for IQOS, accompanied by its own footnote that this is not the same as a 95% reduction in risk.</li><li><strong>IQOS ILUMA and BONDS</strong>: Newer generations: ILUMA (induction heating) in 2021 and a cheaper device, BONDS by IQOS, in 2022.</li><li><strong>ZYN nicotine pouches</strong>: A tobacco-free oral nicotine pouch that came with Swedish Match and became PMI’s second pillar in the US.</li><li><strong>Calls for regulation, 2000</strong>: At WHO hearings on the tobacco treaty, PMI said publicly that the industry should be regulated.</li><li><strong>FDA authorizes IQOS, 2019</strong>: The FDA allowed IQOS onto the US market because it found fewer or lower levels of some toxins than cigarettes, with strict marketing limits.</li><li><strong>“No safe tobacco product”</strong>: The regulator’s refrain across decisions: authorization is not endorsement, and quitting entirely benefits health most.</li><li><strong>FDA reduced-exposure order, 2020</strong>: A second FDA step let PMI tell US adults that switching completely reduces exposure to harmful chemicals, but not that IQOS is less harmful.</li><li><strong>WHO: exposure is not risk</strong>: Three weeks later the WHO said the FDA decision did not show heated tobacco is safer, and warned that exposure claims may mislead.</li><li><strong>FDA authorizes ZYN, 2025</strong>: ZYN pouches cleared the FDA’s premarket pathway in January 2025, a few years after Swedish Match joined PMI.</li><li><strong>ZYN reduced-risk claim, 2026</strong>: The FDA allowed 20 ZYN products to say that using them instead of cigarettes lowers risk of several named diseases, the first MRTP claim of that kind for ZYN.</li><li><strong>Youth-access safeguards</strong>: PMI describes programs to keep its smoke-free products away from people under the legal age; regulators make this a condition of authorization.</li><li><strong>Sampoerna and Coltabaco, 2005</strong>: Two acquisitions that gave PMI the largest cigarette makers in Indonesia and Colombia, the kind of scale that built its international cigarette base.</li><li><strong>Altria’s US IQOS rights</strong>: A 2013 arrangement left Altria with US rights to PMI’s heated product; PMI bought them back after a dispute and launched IQOS in the US in 2025.</li><li><strong>Swedish Match, 2022</strong>: A US$16 billion acquisition that brought ZYN and a leading oral nicotine portfolio, aimed squarely at the US market.</li><li><strong>Vectura and Fertin, 2021</strong>: PMI bought inhaled-drug and oral-delivery businesses to grow beyond nicotine, in what it calls a broader wellness and healthcare push.</li><li><strong>Vectura sold, 2024</strong>: After strong criticism, including from the WHO, PMI sold Vectura, saying the opposition to its transformation was unwarranted.</li><li><strong>Opposing plain packaging</strong>: PMI says it has “forcefully objected” to some regulation, such as plain packs; Tobacco Tactics documents legal and lobbying challenges to EU and other rules.</li><li><strong>Still mostly cigarettes?</strong>: Tobacco Tactics reports that a majority of PMI’s 2025 revenue still came from combustible products, even as PMI reports 42% smoke-free in H1 2026.</li><li><strong>Cigarette volumes rose</strong>: Tobacco Tactics notes cigarette shipments rose in 2024 and that PMI dropped a 2025 target to ship under 550 billion combustible units.</li><li><strong>Two audiences, two messages</strong>: Researchers who analysed a leaked PMI strategy document say the public message is transformation while the investor message stresses cigarette brands.</li><li><strong>Foundation for a Smoke-Free World</strong>: A PMI-funded foundation launched in 2017; the WHO and other health bodies refused to work with it, and PMI ended its funding in 2023.</li></ul></noscript>

, 99 percent of our total shipment volume was covered by youth access prevention programs in our indirect retail channels.","sources":["youth","fda19"],"themes":["claims","regulation"]},{"id":"emerging-markets","title":"Sampoerna and Coltabaco, 2005","type":"deal","cluster":"deals","summary":"Two acquisitions that gave PMI the largest cigarette makers in Indonesia and Colombia, the kind of scale that built its international cigarette base.","evidence":"PMI acquires PT HM Sampoerna Tbk in Indonesia and Compania Colombiana de Tabaco SA (Coltabaco) in Colombia.","when":"2005","start":"2005","sources":["ms"],"themes":["deals"]},{"id":"altria-iqos","title":"Altria’s US IQOS rights","type":"deal","cluster":"deals","summary":"A 2013 arrangement left Altria with US rights to PMI’s heated product; PMI bought them back after a dispute and launched IQOS in the US in 2025.","details":"Tobacco Tactics reports Altria said it had met the milestones to keep its rights, PMI disagreed, and PMI paid Altria US$2.7 billion; rights transferred on 30 April 2024. IQOS went on sale in Austin, Texas in March 2025.","evidence":"In 2013, PMI and Altria had a commercial agreement that PMI not market IQOS in the US.","when":"2013 to 30 April 2024","start":"2013","end":"2024-04-30","sources":["tt","ms"],"themes":["deals"]},{"id":"swedish-match","title":"Swedish Match, 2022","type":"deal","cluster":"deals","featured":true,"summary":"A US$16 billion acquisition that brought ZYN and a leading oral nicotine portfolio, aimed squarely at the US market.","details":"Per Tobacco Tactics, PMI made the offer in May 2022 and by November 2022 controlled the company.","evidence":"the opportunity in the U.S., which is the world’s largest market for smoke-free products","when":"2022","start":"2022","sources":["ms","tt"],"themes":["deals"]},{"id":"beyond-nicotine","title":"Vectura and Fertin, 2021","type":"deal","cluster":"deals","summary":"PMI bought inhaled-drug and oral-delivery businesses to grow beyond nicotine, in what it calls a broader wellness and healthcare push.","evidence":"PMI acquires Fertin Pharma, OtiTopic, and Vectura, providing growth opportunities beyond products that provide nicotine.","when":"2021","start":"2021","sources":["ms","tt"],"themes":["deals"]},{"id":"vectura-sale","title":"Vectura sold, 2024","type":"event","cluster":"scrutiny","summary":"After strong criticism, including from the WHO, PMI sold Vectura, saying the opposition to its transformation was unwarranted.","evidence":"unwarranted opposition to PMI’s transformation","when":"September 2024","start":"2024-09","sources":["tt"],"themes":["scrutiny","deals"]},{"id":"plain-pack","title":"Opposing plain packaging","type":"position","cluster":"scrutiny","summary":"PMI says it has “forcefully objected” to some regulation, such as plain packs; Tobacco Tactics documents legal and lobbying challenges to EU and other rules.","details":"Tobacco Tactics lists a 2014 challenge to the EU Tobacco Products Directive and a 2017 challenge to plain packaging in Uruguay.","evidence":"We still believe that plain packaging inappropriately treats adult smokers as unable to make their own decisions.","sources":["reg","tt"],"themes":["regulation","scrutiny"]},{"id":"combustible-share","title":"Still mostly cigarettes?","type":"claim","cluster":"scrutiny","featured":true,"summary":"Tobacco Tactics reports that a majority of PMI’s 2025 revenue still came from combustible products, even as PMI reports 42% smoke-free in H1 2026.","details":"The two figures cover different periods and are not directly comparable; both are shown as sources state them.","evidence":"the majority of PMI’s revenue – around 59% in 2025 – comes from the sale of cigarettes and other conventional combustible tobacco products","when":"2025","start":"2025","sources":["tt"],"themes":["scrutiny","numbers"]},{"id":"shipments","title":"Cigarette volumes rose","type":"claim","cluster":"scrutiny","summary":"Tobacco Tactics notes cigarette shipments rose in 2024 and that PMI dropped a 2025 target to ship under 550 billion combustible units.","details":"It also cites University of Bath research (2024) finding that PMI’s own volume targets were conservative.","evidence":"shipments of cigarettes rose to 616.8 billion sticks, up from 612.9 billion in 2023","when":"2023–2024","start":"2023","end":"2024","sources":["tt"],"themes":["scrutiny","numbers"]},{"id":"two-faces","title":"Two audiences, two messages","type":"claim","cluster":"scrutiny","summary":"Researchers who analysed a leaked PMI strategy document say the public message is transformation while the investor message stresses cigarette brands.","details":"Tobacco Tactics quotes the study as saying that in investor-facing communications PMI “focus on cigarettes and reiterate the strength of their existing cigarette brand portfolios”. This is the researchers’ reading, not PMI’s.","evidence":"In public-facing communications, PMI stress their commitment to transformation and change","sources":["tt"],"themes":["scrutiny"]},{"id":"fsfw","title":"Foundation for a Smoke-Free World","type":"organisation","cluster":"scrutiny","summary":"A PMI-funded foundation launched in 2017; the WHO and other health bodies refused to work with it, and PMI ended its funding in 2023.","details":"Renamed Global Action to End Smoking in May 2024. Wikipedia reports a 2021 investigation by several outlets that described it as a lobbying tool; that is the investigators’ conclusion, not an established fact.","evidence":"In 2023, the agreement was terminated, with a payment of $140 million.","when":"2017 to 2023","start":"2017-09","end":"2023","sources":["tt","wfsfw"],"themes":["scrutiny"]}],"edges":[{"source":"bond-street","target":"pmi","label":"origin of","kind":"explicit","sources":["ms"]},{"source":"pmi","target":"philip-morris-cos","label":"was an operating company of","kind":"explicit","sources":["ms"]},{"source":"altria-spin","target":"philip-morris-cos","label":"separated PMI from","kind":"explicit","sources":["wpmi","tt"]},{"source":"lausanne","target":"pmi","label":"operations centre of","kind":"explicit","sources":["ms","tt"]},{"source":"altria-spin","target":"altria-iqos","label":"led to 2013 framework: US rights with Altria","kind":"explicit","sources":["ms","tt"]},{"source":"marlboro-brand","target":"pmi","label":"flagship of","kind":"explicit","sources":["ms","tt"]},{"source":"marlboro-brand","target":"marlboro-dispute","label":"dated differently in","kind":"explicit","sources":["ms","wmarl"]},{"source":"emerging-markets","target":"pmi","label":"added cigarette leaders to","kind":"explicit","sources":["ms"]},{"source":"pmi-says-cigs-harmful","target":"marlboro-brand","label":"applies to","kind":"inferred"},{"source":"pmi-says-cigs-harmful","target":"one-billion","label":"motivates concern for","kind":"inferred"},{"source":"pmi","target":"vision-2016","label":"announced","kind":"explicit","sources":["ms","vision"]},{"source":"vision-2016","target":"one-billion","label":"rests on","kind":"explicit","sources":["vision"]},{"source":"vision-2016","target":"not-risk-free","label":"hedged by","kind":"explicit","sources":["vision"]},{"source":"vision-2016","target":"two-thirds-2030","label":"restated as target","kind":"explicit","sources":["ms","progress"]},{"source":"two-thirds-2030","target":"share-2026","label":"measured by","kind":"explicit","sources":["progress","ms"]},{"source":"vision-2016","target":"iqos","label":"to be delivered by","kind":"explicit","sources":["vision","heated"]},{"source":"ceo","target":"pmi","label":"leads","kind":"explicit","sources":["lead"]},{"source":"ceo","target":"swedish-match","label":"described US opportunity of","kind":"explicit","sources":["tt"]},{"source":"neuchatel","target":"pmi","label":"R&D base of","kind":"explicit","sources":["ms"]},{"source":"neuchatel","target":"iqos-pilot","label":"built the capability behind","kind":"inferred"},{"source":"pmi","target":"science-spend","label":"reports","kind":"explicit","sources":["science"]},{"source":"science-spend","target":"iqos","label":"funds","kind":"inferred"},{"source":"iqos-pilot","target":"iqos-launch-2015","label":"then","kind":"explicit","sources":["ms"]},{"source":"iqos-pilot","target":"iqos","label":"first trial of","kind":"explicit","sources":["ms"]},{"source":"iqos-launch-2015","target":"vision-2016","label":"then","kind":"explicit","sources":["ms"]},{"source":"iqos","target":"iqos-claim","label":"marketed with","kind":"explicit","sources":["heated"]},{"source":"iqos","target":"iqos-ilumabonds","label":"evolved into","kind":"explicit","sources":["heated","ms"]},{"source":"iqos","target":"zyn","label":"sits beside","kind":"explicit","sources":["vision"]},{"source":"zyn","target":"two-thirds-2030","label":"counts toward","kind":"inferred"},{"source":"iqos","target":"fda-pmta-2019","label":"authorized in the US via","kind":"explicit","sources":["ms","fda19"]},{"source":"fda-pmta-2019","target":"fda-mrtp-2020","label":"followed by","kind":"explicit","sources":["ms","who20"]},{"source":"fda-mrtp-2020","target":"who-response","label":"answered by","kind":"explicit","sources":["who20"]},{"source":"who-response","target":"iqos-claim","label":"questions the meaning of","kind":"explicit","sources":["who20"]},{"source":"fda-pmta-2019","target":"no-safe-product","label":"came with","kind":"explicit","sources":["fda19"]},{"source":"fda-zyn-mrp","target":"no-safe-product","label":"came with","kind":"explicit","sources":["fdazyn"]},{"source":"fda-pmta-2019","target":"youth","label":"required safeguards for","kind":"explicit","sources":["fda19"]},{"source":"pmi","target":"youth","label":"describes","kind":"explicit","sources":["youth"]},{"source":"zyn","target":"fda-zyn-2025","label":"authorized by","kind":"explicit","sources":["fdazyn","ms"]},{"source":"fda-zyn-2025","target":"fda-zyn-mrp","label":"followed by","kind":"explicit","sources":["fdazyn"]},{"source":"swedish-match","target":"zyn","label":"brought","kind":"expl cigarettes","summary":"PMI’s own argument, in its own order: a billion smokers, a vision hedged by “not risk-free”, two product families, a revenue target and the latest progress figure.","steps":["one-billion","vision-2016","not-risk-free","iqos","zyn","two-thirds-2030","share-2026"]},{"id":"cigarette-empire","title":"A cigarette empire","summary":"Where the company came from, and the brand that still anchors it: from a London shop to the world’s best-selling cigarette.","steps":["bond-street","pmi","marlboro-brand","marlboro-no1"]},{"id":"regulators-weigh-in","title":"How regulators and the WHO read IQOS","summary":"One product, two readings: the FDA authorizes IQOS with caveats and a narrow exposure claim, and the WHO says reduced exposure does not prove reduced risk.","steps":["iqos","fda-pmta-2019","fda-mrtp-2020","who-response","iqos-claim"]},{"id":"buying-the-us","title":"Getting to the US market","summary":"The US is the biggest prize for smoke-free products. The route took a spin-off, a rights dispute with Altria, a US$16 billion acquisition and two FDA decisions.","steps":["altria-spin","altria-iqos","iqos","swedish-match","zyn","fda-zyn-2025","fda-zyn-mrp"]},{"id":"said-and-shown","title":"What PMI says and what the numbers show","summary":"The vision is a target, not yet a fact. This path sets PMI’s own progress figure beside independent reporting on cigarette revenue, volumes and messaging.","steps":["two-thirds-2030","share-2026","combustible-share","shipments","two-faces"]}]}</script>
<script>
(() => {
"use strict";
const story = JSON.parse(document.getElementById("story-data").textContent);
const theme = JSON.parse(document.getElementById("theme-data").textContent);
const NS = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const isNarrow = () => innerWidth <= 760;

/* ---------- tiny DOM helpers (all text goes through textContent: no HTML injection) ---------- */
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
function sv(tag, props) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(props || {})) if (v != null) e.setAttribute(k, v);
  return e;
}
const safeUrl = (u) => { try { return /^https?:$/.test(new URL(u).protocol) ? u : null; } catch { return null; } };
const cap = (s) => String(s || "").replace(/[-_]/g, " ").replace(/^./, (c) => c.toUpperCase());

/* ---------- theme ---------- */
const hex2rgb = (h) => { h = h.replace("#", ""); if (h.length === 3) h = [...h].map((x) => x + x).join(""); return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16)); };
function rgb2hsl([r, g, b]) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn; let h = 0, s = 0; const l = (mx + mn) / 2;
  if (d) { s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn); h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; }
  return [h, s, l];
}
const nClusters = story.clusters.length;
const cIndex = new Map(story.clusters.map((c, i) => [c.id, i]));
function clusterColor(id) {
  if (theme.clusters && theme.clusters[id]) return theme.clusters[id];
  const [h, s] = rgb2hsl(hex2rgb(theme.colors.accent));
  const hue = (h + cIndex.get(id) * (360 / nClusters)) % 360;
  return `hsl(${hue.toFixed(0)} ${Math.max(45, Math.min(75, s * 100)).toFixed(0)}% ${theme.mode === "dark" ? 66 : 40}%)`;
}
const colors = Object.fromEntries(story.clusters.map((c) => [c.id, clusterColor(c.id)]));
if (theme.font) {
  if (theme.font.body) document.body.style.fontFamily = theme.font.body;
  if (theme.font.display) $("wordmark").style.fontFamily = theme.font.display;
}
const wm = theme.wordmark || {};
$("wordmark").textContent = wm.text || story.title;
if (wm.letterSpacing) $("wordmark").style.letterSpacing = wm.letterSpacing;
if (wm.uppercase) $("wordmark").style.textTransform = "uppercase";
if (theme.logo && theme.logo.src) $("logo").append(el("img", { src: theme.logo.src, alt: theme.logo.alt || "" }));
$("dek").textContent = story.tagline;
$("credit").textContent = [story.disclaimer, story.credit].filter(Boolean).join(" ");

/* ---------- model ---------- */
const nodes = story.nodes.map((n) => ({ ...n, x: 0, y: 0, vx: 0, vy: 0, deg: 0, color: colors[n.cluster], isRoot: n.id === story.root }));
const byId = new Map(nodes.map((n) => [n.id, n]));
const edges = story.edges.map((e, i) => ({ ...e, i, a: byId.get(e.source), b: byId.get(e.target) }));
const adj = new Map(nodes.map((n) => [n.id, new Set()]));
for (const e of edges) { e.a.deg++; e.b.deg++; adj.get(e.source).add(e.target); adj.get(e.target).add(e.source); }
for (const n of nodes) n.r = n.isRoot ? 30 : (n.featured ? 13 : 8) + Math.min(n.deg, 8) * 0.45;
const srcById = new Map(story.sources.map((s) => [s.id, s]));
const storyById = new Map((story.stories || []).map((s) => [s.id, s]));

/* ---------- force layout (deterministic, no dependencies) ---------- */
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function layout() {
  const rnd = rng(7), N = nodes.length;
  const sector = (id) => 2 * Math.PI * (cIndex.get(id) + 0.5) / nClusters;
  const R = 330 + Math.sqrt(N) * 40;
  const asp = Math.max(0.75, Math.min(2.2, svgEl.clientWidth / Math.max(1, svgEl.clientHeight))), ax = Math.sqrt(asp), ay = 1 / ax; // fill the stage shape
  for (const n of nodes) {
    n.vx = n.vy = 0;
    if (n.isRoot) { n.x = n.y = 0; continue; }
    const ang = sector(n.cluster) + (rnd() - 0.5) * 0.9, rad = R * (0.45 + rnd() * 0.7);
    n.x = Math.cos(ang) * rad * ax; n.y = Math.sin(ang) * rad * ay;
  }
  const iters = N > 140 ? 220 : 480, XS = 0.55; // XS<1 makes horizontal crowding count more: labels are wider than tall
  for (let it = 0; it < iters; it++) {
    const alpha = Math.pow(1 - it / iters, 1.4);
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
      const a = nodes[i], b = nodes[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      if (dx * dx + dy * dy < 1) { dx = rnd() - .5; dy = rnd() - .5; }
      const wd = Math.sqrt(dx * dx * XS * XS + dy * dy) || 1, d = Math.sqrt(dx * dx + dy * dy) || 1;
      const min = a.r + b.r + 95;
      let f = 26000 / (wd * wd); if (wd < min) f += (min - wd) * 0.9;
      f *= alpha + 0.04;
      const fx = dx / d * f, fy = dy / d * f;
      a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
    }
    for (const e of edges) {
      const a = e.a, b = e.b, dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
      const L = a.cluster === b.cluster ? 150 : 250, f = (d - L) * 0.03 * (alpha + 0.1);
      const fx = dx / d * f, fy = dy / d * f; a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
    }
    for (const n of nodes) {
      if (n.isRoot) continue;
      const s = sector(n.cluster), tx = Math.cos(s) * R * ax, ty = Math.sin(s) * R * ay;
      n.vx += (tx - n.x) * 0.014 * alpha; n.vy += (ty - n.y) * 0.014 * alpha;
      n.x += n.vx * 0.6; n.y += n.vy * 0.6; n.vx *= 0.55; n.vy *= 0.55;
    }
  }
}

/* ---------- SVG build ---------- */
const svgEl = $("graph"), vp = $("vp");
for (const e of edges) {
  e.line = sv("line", { class: "edge" + (e.kind === "inferred" ? " inferred" : "") });
  e.line.append(Object.assign(sv("title"), { textContent: `${e.a.title} → ${e.b.title}: ${e.label} (${e.kind})` }));
  e.text = sv("text", { class: "edge-label" }); e.text.textContent = e.label;
  $("edges").append(e.line); $("edge-labels").append(e.text);
}
for (const n of nodes) {
  const g = sv("g", { class: "node" + (n.isRoot ? " root" : ""), tabindex: 0, role: "button", "aria-label": `${n.title}, ${cap(n.type)}, ${story.clusters[cIndex.get(n.cluster)].label}`, "data-id": n.id });
  g.append(sv("circle", { r: n.r + 11, fill: "transparent" }));
  g.append(sv("circle", { class: "ring", r: n.r + 6 }));
  g.append(sv("circle", { class: "core", r: n.r, stroke: n.color, style: n.isRoot ? "fill:" + n.color : null }));
  if (!n.isRoot) g.append(sv("circle", { class: "dot", r: Math.max(2, n.r * 0.22), fill: n.color }));
  const lab = sv("text", { class: "label", y: n.r + 15 }); lab.textContent = n.title; g.append(lab);
  if (!n.isRoot) { const k = sv("text", { class: "kind", y: n.r + 26 }); k.textContent = cap(n.type); g.append(k); }
  g.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(n.id, { center: true }); } });
  n.g = g; $("nodes").append(g);
}
function place() {
  for (const e of edges) {
    e.line.setAttribute("x1", e.a.x); e.line.setAttribute("y1", e.a.y); e.line.setAttribute("x2", e.b.x); e.line.setAttribute("y2", e.b.y);
    e.text.setAttribute("x", (e.a.x + e.b.x) / 2); e.text.setAttribute("y", (e.a.y + e.b.y) / 2 - 4);
  }
  for (const n of nodes) n.g.setAttribute("transform", `translate(${n.x.toFixed(1)} ${n.y.toFixed(1)})`);
  drawStoryPath();
}

/* ---------- view (pan / zoom) ---------- */
const view = { x: 0, y: 0, k: 1 };
function applyView() { svgEl.style.setProperty("--ls", Math.min(2.2, Math.max(1, 0.95 / view.k)).toFixed(2)); vp.setAttribute("transform", `translate(${view.x} ${view.y}) scale(${view.k})`); svgEl.classList.toggle("zoomed", view.k >= 1.15); }
let tweenId = 0;
function tween(to, ms = 480) {
  cancelAnimationFrame(tweenId);
  if (reduceMotion) { Object.assign(view, to); applyView(); return; }
  const from = { ...view }, t0 = performance.now();
  const step = (t) => {
    const p = Math.min(1, (t - t0) / ms), q = 1 - Math.pow(1 - p, 3);
    view.x = from.x + (to.x - from.x) * q; view.y = from.y + (to.y - from.y) * q; view.k = from.k + (to.k - from.k) * q; applyView();
    if (p < 1) tweenId = requestAnimationFrame(step);
  };
  tweenId = requestAnimationFrame(step);
}
const stageBox = () => {
  const W = svgEl.clientWidth, H = svgEl.clientHeight;
  const panelOpen = $("panel").classList.contains("open");
  return { W, H, left: 0, right: panelOpen && !isNarrow() ? Math.min(400, W) : 0, bottom: (panelOpen && isNarrow() ? H * 0.58 : 0) + $("foot").offsetHeight };
};
function fit(animate = true, list = nodes) {
  const { W, H, right, bottom } = stageBox();

  const st = storyById.get(S.readStory) || all[0]; S.readStory = st.id;
  const wrap = el("div", { class: "read-wrap" });
  wrap.append(el("div", { class: "read-tabs" }, all.map((s) => el("button", { class: "chip", "aria-pressed": String(s.id === st.id), text: s.title, onclick: () => { S.readStory = s.id; renderRead(); box.scrollTop = 0; } }))));
  wrap.append(el("h2", { class: "rt", text: st.title }));
  if (st.summary) wrap.append(el("p", { class: "intro", text: st.summary }));
  st.steps.forEach((id, i) => {
    const n = byId.get(id), prev = i ? byId.get(st.steps[i - 1]) : null;
    const e = prev ? edges.find((x) => (x.a === prev && x.b === n) || (x.a === n && x.b === prev)) : null;
    const srcs = (n.sources || []).map((s) => srcById.get(s)).filter(Boolean);
    wrap.append(el("section", { class: "rstep", style: `--c:${n.color}` },
      el("span", { class: "rnum", text: String(i + 1) }),
      e ? el("p", { class: "via" }, `${e.a.title} `, el("em", { text: `${e.label} →` }), ` ${e.b.title}`, e.kind === "inferred" ? " (inferred)" : "") : null,
      el("h3", null, el("button", { text: n.title, onclick: () => select(n.id) })),
      el("p", { class: "meta", text: [story.clusters[cIndex.get(n.cluster)].label, cap(n.type), n.when].filter(Boolean).join(" · ") }),
      el("p", { text: n.summary }),
      n.details ? el("p", { class: "details", text: n.details }) : null,
      n.evidence ? el("blockquote", { text: n.evidence }) : null,
      srcs.length ? el("p", { class: "rsrc" }, "Sources: ", srcs.flatMap((s, k) => { const u = safeUrl(s.url); return [k ? ", " : "", u ? el("a", { href: u, target: "_blank", rel: "noopener noreferrer", text: s.title }) : s.title]; })) : null,
      el("p", null, el("button", { class: "chip", text: "Show on graph", onclick: () => showStep(st.id, i) }))));
  });
  box.append(wrap);
}

/* ----- outline: the graph as a collapsible tree from the root ----- */
const tree = (() => {
  const nbrs = new Map(nodes.map((n) => [n.id, []]));
  for (const e of [...edges].sort((a, b) => (a.kind === "explicit" ? 0 : 1) - (b.kind === "explicit" ? 0 : 1))) { nbrs.get(e.source).push([e.target, e]); nbrs.get(e.target).push([e.source, e]); }
  const parent = new Map([[story.root, null]]), kids = new Map(nodes.map((n) => [n.id, []])), q = [story.root];
  while (q.length) { const id = q.shift(); for (const [o, e] of nbrs.get(id)) if (!parent.has(o)) { parent.set(o, { id, e }); kids.get(id).push(o); q.push(o); } }
  const treeEdges = new Set([...parent.values()].filter(Boolean).map((p) => p.e));
  return { parent, kids, treeEdges, orphans: nodes.filter((n) => !parent.has(n.id)) };
})();
S.open.add(story.root);
function renderOutline() {
  const box = $("outline"); box.textContent = "";
  const wrap = el("div", { class: "ol-wrap" });
  wrap.append(el("div", { class: "ol-tools" },
    el("button", { class: "btn", text: "Expand all", onclick: () => { nodes.forEach((n) => S.open.add(n.id)); renderOutline(); } }),
    el("button", { class: "btn", text: "Collapse all", onclick: () => { S.open.clear(); S.open.add(story.root); renderOutline(); } })));
  const item = (n) => {
    const kids = tree.kids.get(n.id), p = tree.parent.get(n.id), dim = !matches(n);
    const head = [
      el("i", { style: `--c:${n.color}` }),
      p ? el("span", { class: "via", text: `${p.e.a.id === p.id ? "→" : "←"} ${p.e.label}` }) : null,
      el("button", { class: "olt", text: n.title, onclick: (ev) => { ev.preventDefault(); ev.stopPropagation(); select(n.id); } }),
      el("small", { text: [cap(n.type), n.when].filter(Boolean).join(" · ") }),
    ];
    const also = edges.filter((e) => (e.a === n || e.b === n) && !tree.treeEdges.has(e)).slice(0, 8);
    const body = el("div", { class: "olbody" }, el("p", { text: n.summary }),
      also.length ? el("p", null, "Also: ", also.flatMap((e, k) => { const o = e.a === n ? e.b : e.a; return [k ? "  ·  " : "", el("button", { class: "olink", text: `${e.a === n ? "→" : "←"} ${e.label} ${o.title}`, onclick: () => select(o.id) })]; })) : null);
    if (!kids.length) return el("li", { class: dim ? "dim" : "" }, el("div", { class: "row" }, head), body);
    return el("li", { class: dim ? "dim" : "" },
      el("details", { open: S.open.has(n.id), ontoggle: (ev) => { if (ev.target.open) S.open.add(n.id); else S.open.delete(n.id); } },
        el("summary", { class: "row" }, head, el("span", { class: "olcount", text: String(kids.length) })), body,
        el("ul", null, kids.map((k) => item(byId.get(k))))));
  };
  wrap.append(el("ul", null, item(byId.get(story.root))));
  if (tree.orphans.length) wrap.append(el("h3", { text: "Not connected to the root", style: "margin:24px 0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)" }), el("ul", null, tree.orphans.map((n) => el("li", null, el("div", { class: "row" }, el("i", { style: `--c:${n.color}` }), el("button", { class: "olt", text: n.title, onclick: () => select(n.id) }), el("small", { text: cap(n.type) }))))));
  box.append(wrap);
}

/* ----- switching ----- */
function setView(v) {
  if (!viewList.includes(v)) v = viewList[0];
  const was = S.view; S.view = v;
  for (const key of ["list", "timeline", "read", "outline"]) $(key).classList.toggle("on", v === key);
  svgEl.style.visibility = v === "graph" ? "visible" : "hidden";
  const spatial = v === "graph" || v === "timeline";
  $("zoom").style.display = spatial ? "" : "none";
  $("zoom").classList.toggle("right", v === "timeline");
  $("btn-fit").style.display = spatial ? "" : "none";
  $("chips").style.display = v === "read" ? "none" : "";
  $("stories").style.display = spatial ? "" : "none";
  if (!spatial && S.story) endStoryQuiet();
  for (const b of $("views").children) b.setAttribute("aria-pressed", String(b.dataset.v === v));
  if (v === "read") renderRead();
  render();
  if (v === "graph" && was !== "graph") requestAnimationFrame(() => { if (!touched) fit(false); });
  if (v === "timeline") requestAnimationFrame(renderTimeline);
}

/* ---------- toolbar ---------- */
const usedClusters = new Set(nodes.map((n) => n.cluster));
$("chips").append(el("button", { class: "chip", "data-c": "all", text: "All", onclick: () => { S.filter = "all"; render(); } }));
for (const c of story.clusters) if (usedClusters.has(c.id)) $("chips").append(el("button", { class: "chip", "data-c": c.id, style: `--c:${colors[c.id]}`, onclick: () => { S.filter = S.filter === c.id ? "all" : c.id; render(); } }, el("i"), c.label));
if ((story.stories || []).length) {
  $("stories").append(el("span", { text: "Follow a story" }));
  for (const s of story.stories) $("stories").append(el("button", { class: "chip", "data-s": s.id, title: s.summary || "", text: s.title, onclick: () => (S.story && S.story.id === s.id ? endStory() : startStory(s.id)) }));
}
for (const c of story.clusters) if (usedClusters.has(c.id)) $("legend").append(el("span", { style: `--c:${colors[c.id]}` }, el("i"), c.label));
$("legend").append(el("span", { title: "Relationship directly supported by a cited source" }, (() => { const s = sv("svg", { viewBox: "0 0 22 8" }); s.append(sv("line", { x1: 0, y1: 4, x2: 22, y2: 4, stroke: "currentColor", "stroke-width": 1.5 })); return s; })(), "sourced"));
$("legend").append(el("span", { title: "Editorial bridge: an interpretation, not a direct claim" }, (() => { const s = sv("svg", { viewBox: "0 0 22 8" }); s.append(sv("line", { x1: 0, y1: 4, x2: 22, y2: 4, stroke: "currentColor", "stroke-width": 1.5, "stroke-dasharray": "3 4" })); return s; })(), "inferred"));

$("views").append(...viewList.map((v) => el("button", { "data-v": v, "aria-pressed": "false", text: VIEW_LABEL[v], onclick: () => setView(v) })));
if (viewList.length < 2) $("views").style.display = "none";
$("q").addEventListener("input", (e) => { S.q = e.target.value.trim().toLowerCase(); render(); });
$("btn-fit").onclick = () => { if (S.view === "timeline") { tlReset(); renderTimeline(); } else fit(); };
$("btn-reset").onclick = () => { S.filter = "all"; S.q = ""; $("q").value = ""; endStoryQuiet(); tlReset(); layout(); place(); select(null); fit(); };
/* Full screen: only offered where the browser supports it and the page is not embedded (an embedding page, like the product site, has its own button). */
(() => {
  const btn = $("btn-fs"), root = document.documentElement;
  const request = root.requestFullscreen || root.webkitRequestFullscreen;
  const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  let embedded = false; try { embedded = window.self !== window.top; } catch { embedded = true; }
  if (!request || document.fullscreenEnabled === false || embedded) return;
  const sync = () => { btn.textContent = isFs() ? "Exit full screen" : "Full screen"; btn.setAttribute("aria-pressed", String(isFs())); };
  const toggle = () => { if (isFs()) (document.exitFullscreen || document.webkitExitFullscreen).call(document); else { const r = request.call(root); if (r && r.catch) r.catch(() => {}); } };
  btn.hidden = false; btn.onclick = toggle; sync();
  document.addEventListener("fullscreenchange", sync); document.addEventListener("webkitfullscreenchange", sync);
  addEventListener("keydown", (e) => { if ((e.key === "f" || e.key === "F") && !e.ctrlKey && !e.metaKey && !e.altKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) { e.preventDefault(); toggle(); } });
})();
$("zin").onclick = () => (S.view === "timeline" ? tlZoom(1 / 1.4, (TL.geo ? TL.geo.x0 + TL.geo.pw / 2 : 0)) : zoomAt(1.3, svgEl.clientWidth / 2, svgEl.clientHeight / 2));
$("zout").onclick = () => (S.view === "timeline" ? tlZoom(1.4, (TL.geo ? TL.geo.x0 + TL.geo.pw / 2 : 0)) : zoomAt(1 / 1.3, svgEl.clientWidth / 2, svgEl.clientHeight / 2));
$("sb-prev").onclick = () => goStep(S.step - 1); $("sb-next").onclick = () => goStep(S.step + 1); $("sb-exit").onclick = endStory;
addEventListener("keydown", (e) => {
  const typing = e.target.tagName === "INPUT";
  if (e.key === "/" && !typing) { e.preventDefault(); $("q").focus(); }
  else if (e.key === "Escape") { if (typing) e.target.blur(); else if (S.selected) select(null); else if (S.story) endStory(); }
  else if (S.story && !typing && e.key === "ArrowRight") goStep(S.step + 1);
  else if (S.story && !typing && e.key === "ArrowLeft") goStep(S.step - 1);
});

/* ---------- pointer interaction: pan, zoom, pinch, drag nodes ---------- */
const ptrs = new Map(); let drag = null;
const toWorld = (cx, cy) => { const r = svgEl.getBoundingClientRect(); return [(cx - r.left - view.x) / view.k, (cy - r.top - view.y) / view.k]; };
const pinchInfo = () => { const [a, b] = [...ptrs.values()]; return { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; };
svgEl.addEventListener("pointerdown", (e) => {
  cancelAnimationFrame(tweenId);
  svgEl.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2) { drag = { type: "pinch", ...pinchInfo() }; return; }
  const g = e.target.closest && e.target.closest(".node");
  drag = g ? { type: "node", n: byId.get(g.dataset.id), sx: e.clientX, sy: e.clientY, moved: false }
           : { type: "pan", sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, moved: false };
});
svgEl.addEventListener("pointermove", (e) => {
  if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!drag) return;
  if (drag.type === "pinch" && ptrs.size === 2) {
    const p = pinchInfo(), r = svgEl.getBoundingClientRect();
    zoomAt(p.d / drag.d, p.mx - r.left, p.my - r.top); view.x += p.mx - drag.mx; view.y += p.my - drag.my; applyView(); drag = { type: "pinch", ...p }; return;
  }
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.moved && Math.hypot(dx, dy) > 4) { drag.moved = true; svgEl.classList.add("dragging"); }
  if (!drag.moved) return;
  if (drag.type === "pan") { view.x = drag.vx + dx; view.y = drag.vy + dy; applyView(); }
  else if (drag.type === "node") { const [wx, wy] = toWorld(e.clientX, e.clientY); drag.n.x = wx; drag.n.y = wy; place(); }
});
const endPtr = (e) => {
  ptrs.delete(e.pointerId); svgEl.classList.remove("dragging");
  if (drag && drag.type !== "pinch" && !drag.moved) { if (drag.type === "node") select(drag.n.id, { center: false }); else if (S.selected && !S.story) select(null); }
  if (ptrs.size < 2) drag = null;
};
svgEl.addEventListener("pointerup", endPtr); svgEl.addEventListener("pointercancel", endPtr);
svgEl.addEventListener("wheel", (e) => { e.preventDefault(); const r = svgEl.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
let sized = svgEl.clientWidth > 0 && svgEl.clientHeight > 0, touched = false;
svgEl.addEventListener("pointerdown", () => { touched = true; }); svgEl.addEventListener("wheel", () => { touched = true; }, { passive: true });
const onSize = () => {
  if (S.view === "timeline") { renderTimeline(); return; }
  if (S.view !== "graph" || !svgEl.clientWidth || !svgEl.clientHeight) return;
  if (!sized) { sized = true; layout(); place(); fit(false); return; } // first real size (page was loaded hidden / zero-sized)
  if (!touched && !S.selected && !S.story) fit(false);
};
if (window.ResizeObserver) { new ResizeObserver(onSize).observe(svgEl); new ResizeObserver(() => { if (S.view === "timeline") renderTimeline(); }).observe($("timeline")); } else addEventListener("resize", onSize);

/* ---------- boot ---------- */
layout(); place(); setView(viewList.includes(story.defaultView) ? story.defaultView : "graph"); fit(false);
function fromHash() {
  const p = new URLSearchParams(location.hash.replace(/^#/, ""));
  if (p.has("view") && S.view !== p.get("view")) setView(p.get("view"));
  if (p.has("story") && storyById.has(p.get("story")) && !(S.story && S.story.id === p.get("story"))) startStory(p.get("story"));
  else if (p.has("node") && byId.has(p.get("node")) && S.selected !== p.get("node")) select(p.get("node"), { center: true });
}
addEventListener("hashchange", fromHash);
fromHash();
})();
</script>
