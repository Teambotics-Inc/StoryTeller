<noscript><h1>Salary</h1><p>A word for pay that was built on salt, and why nobody can prove Roman soldiers were ever paid in it.</p><p>This interactive story graph needs JavaScript. The full content follows.</p><ul><li><strong>salary</strong>: A fixed regular payment for work, usually quoted per year. The story asks how a word with salt inside it ended up on a payslip.</li><li><strong>Salaried versus hourly</strong>: The everyday contrast: salary is pay by the period, wages are pay by the hour. US law wrote the split down in the 1930s.</li><li><strong>Salaryman (sararīman)</strong>: Japan borrowed the English word to name a new kind of worker, the company office employee, and it grew into a national social image.</li><li><strong>Worth one&#39;s salt</strong>: An English idiom for doing a job well enough to earn your keep, said to descend from the Roman salarium.</li><li><strong>Beer rations on clay</strong>: The oldest pay record the sources mention is not money at all: a tablet counting workers&#39; daily beer. Pay in goods long predates pay in coin.</li><li><strong>Salary was rare</strong>: For centuries regular salaried work was the exception, reserved for servants and higher-status roles, and pay often came as lodging and food.</li><li><strong>Salaried vs honorary</strong>: The adjective salaried first set paid posts against honorary, unpaid ones. Only later did the opposite become hourly.</li><li><strong>Office work needs a salary</strong>: Big firms created managers and clerks whose output was hard to count by the hour, and a per-period salary fitted them.</li><li><strong>To salary (verb)</strong>: English made a verb from the noun, recorded in Caxton: to pay someone a regular salary.</li><li><strong>salarie in Middle English</strong>: The word enters English with the general sense of pay or reward, not yet a yearly figure.</li><li><strong>Anglo-French salarie</strong>: The French of medieval England is the bridge that carried the Latin word across the Channel into English.</li><li><strong>Old French salaire</strong>: Latin salarium evolved into French salaire, the direct parent of the English word and the one still in use in modern French.</li><li><strong>Latin salarium</strong>: The Latin word for an allowance or stipend, and the hinge of the whole story. It is built on the word for salt, but the sources cannot say why.</li><li><strong>Latin salarius</strong>: An adjective meaning roughly &#39;to do with salt&#39;. Salarium is that adjective turned into a noun.</li><li><strong>Via Salaria, the salt road</strong>: A road out of Rome named for salt, used for fetching it. It shows how central salt was to early Rome&#39;s geography and trade, which is the background any salt-pay theory needs.</li><li><strong>Stipendium (stipend)</strong>: Rome&#39;s other word for soldier&#39;s pay, literally a weighing-out of coin. It is the closest relative of salarium and entered English as stipend.</li><li><strong>PIE *sḗh₂l, salt</strong>: The reconstructed ancestor of words for salt across Europe and beyond. Nobody wrote it down; it is inferred from its descendants.</li><li><strong>Latin sal</strong>: The plain Latin word for salt. Everything Roman in this story grows from it.</li><li><strong>Greek hals</strong>: Greek&#39;s own descendant of the same root, a reminder that salt was named in much the same way on both sides of the Mediterranean.</li><li><strong>English salt</strong>: English salt reaches the same root by the Germanic route, so salary and salt are distant cousins by descent as well as parent and child by meaning.</li><li><strong>&quot;Salt money&quot; (unattested)</strong>: The tidy explanation, salarium as short for &#39;salt money&#39;, rests on a phrase nobody has found in a Roman text.</li><li><strong>A salt allowance</strong>: The cautious reading: soldiers got money meant to buy salt (and perhaps other small things), not salt itself. Even this is not well established.</li><li><strong>What did Pliny say?</strong>: Two modern writers quote Pliny&#39;s Natural History differently: one has him tying soldiers&#39; reward to salt, the other reads it as being about salt taxes. This study has not read Pliny first-hand and does not choose.</li><li><strong>&quot;Paid in salt&quot; is a myth</strong>: The popular claim that legions received salt as wages has no backing in the ancient evidence as these sources report it. One source reports no surviving payroll record that specifies salt rather than coin.</li><li><strong>Greek sitērion, grain-pay</strong>: Greek made its word for pay out of grain, not salt. Naming wages after the staple you were given is not unique to Rome.</li><li><strong>Wage</strong>: Salary&#39;s everyday rival has a completely different ancestry: a Germanic word for a pledge, not a Latin word for salt.</li></ul></noscript>

ce employee, and it grew into a national social image.","evidence":"Derived from English \"salaried man\"; after WWII \"a symbol of the typical Japanese worker\".","sources":["salaryman","ety"],"start":"1912","end":"1935"},{"id":"worth-salt","title":"Worth one's salt","type":"idiom","cluster":"modern","summary":"An English idiom for doing a job well enough to earn your keep, said to descend from the Roman salarium.","evidence":"The salarium \"gave rise to such expressions as 'being worth one's salt'\" (Wikipedia).","sources":["wiki-sal"]},{"id":"beer-rations","title":"Beer rations on clay","type":"precedent","cluster":"cousins","when":"c. 3100 BCE","summary":"The oldest pay record the sources mention is not money at all: a tablet counting workers' daily beer. Pay in goods long predates pay in coin.","evidence":"\"A cuneiform inscribed clay tablet dated about 3100 BCE provides a record of the daily beer rations for workers in Mesopotamia.\"","sources":["wiki-sal"],"start":"-3100"},{"id":"medieval-rare","title":"Salary was rare","type":"shift","cluster":"shifts","when":"Middle Ages","summary":"For centuries regular salaried work was the exception, reserved for servants and higher-status roles, and pay often came as lodging and food.","evidence":"Salaried employment \"relatively rare and mostly limited to servants and higher status roles, especially in government service\"; pay could be \"lodging, food, and livery clothes\".","sources":["wiki-sal"],"start":"0500","end":"1500"},{"id":"honorary","title":"Salaried vs honorary","type":"shift","cluster":"shifts","when":"c. 1600","summary":"The adjective salaried first set paid posts against honorary, unpaid ones. Only later did the opposite become hourly.","evidence":"Salaried, c. 1600, originally contrasted with honorary; later with hourly.","sources":["ety"],"start":"1600"},{"id":"office-work","title":"Office work needs a salary","type":"shift","cluster":"shifts","when":"1870-1930","summary":"Big firms created managers an s","type":"word-form","cluster":"rome","summary":"An adjective meaning roughly 'to do with salt'. Salarium is that adjective turned into a noun.","evidence":"Salarium is a \"nominalization of salārius ('of or relating to salt')\".","sources":["wikt-la","wikt-en"]},{"id":"via-salaria","title":"Via Salaria, the salt road","type":"place","cluster":"rome","summary":"A road out of Rome named for salt, used for fetching it. It shows how central salt was to early Rome's geography and trade, which is the background any salt-pay theory needs.","evidence":"\"The Via Salaria owes its name to the Latin word for 'salt'.\"","sources":["wiki-via","wiki-hs"]},{"id":"stipendium","title":"Stipendium (stipend)","type":"word-form","cluster":"rome","when":"stipend: early 15c.","summary":"Rome's other word for soldier's pay, literally a weighing-out of coin. It is the closest relative of salarium and entered English as stipend.","evidence":"Latin stipendium, \"in military use 'pay, salary'\", from stips \"small payment\" + pendere \"to hang; weigh; pay\".","sources":["stipend","wikt-la"],"start":"1400","end":"1433"},{"id":"pie-salt","title":"PIE *sḗh₂l, salt","type":"root","cluster":"root","featured":true,"summary":"The reconstructed ancestor of words for salt across Europe and beyond. Nobody wrote it down; it is inferred from its descendants.","evidence":"Descendants listed include Latin sal, Greek hā́ls, Proto-Germanic *saltą, Old Church Slavonic solь and Latvian sāls.","sources":["pie"]},{"id":"sal","title":"Latin sal","type":"word-form","cluster":"root","summary":"The plain Latin word for salt. Everything Roman in this story grows from it.","evidence":"Latin sal descends from the Proto-Indo-European root for salt.","sources":["pie","wikt-la"]},{"id":"greek-hals","title":"Greek hals","type":"word-form","cluster":"root","summary":"Greek's own descendant of the same root, a reminder that salt was named in much the same way on both sides of the Mediterranean.","evidence":"Greek hā́ls listed as a descendant of the PIE salt root.","sources":["pie"]},{"id":"english-salt","title":"English salt","type":"word-form","cluster":"root","summary":"English salt reaches the same root by the Germanic route, so salary and salt are distant cousins by descent as well as parent and child by meaning.","evidence":"Proto-Germanic *saltą is listed as the ancestor of English salt.","sources":["pie"]},{"id":"salarium-argentum","title":"\"Salt money\" (unattested)","type":"theory","cluster":"debate","summary":"The tidy explanation, salarium as short for 'salt money', rests on a phrase nobody has found in a Roman text.","evidence":"\"It is generally assumed that salārium was an abbreviation of salārium argentum ('salt money'), though that phrase is not attested.\"","sources":["wikt-en"]},{"id":"salt-allowance","title":"A salt allowance","type":"theory","cluster":"debate","summary":"The cautious reading: soldiers got money meant to buy salt (and perhaps other small things), not salt itself. Even this is not well established.","evidence":"\"a salārium may have been an allowance paid to Roman soldiers for the purchase of salt, but even that is not well established.\"","sources":["wiki-hs","wikt-en"]},{"id":"pliny-dispute","title":"What did Pliny say?","type":"dispute","cluster":"debate","when":"1st c. CE","summary":"Two modern writers quote Pliny's Natural History differently: one has him tying soldiers' reward to salt, the other reads it as being about salt taxes. This study has not read Pliny first-hand and does not choose.","evidence":"etymologia.org renders Pliny: \"In the old days, it was with salt that the valor of soldiers was rewarded, whence the Latin word for pay is derived.\" Coverley renders 31.89 as salt \"related to magistracies and duty abroad, and that's where we get the word 'salaries'\".","sources":["etymologia","cover"],"start":"0001","end":"0100"},{"id":"no-salt-pay","title":"\"Paid in salt\" is a myth","type":"debunk","cluster":"debate","summary":"The popular claim that legions received salt as wages has no backing in the ancient evidence as these sources report it. One source reports no surviving payroll record that specifies salt rather than coin.","evidence":"\"a persistent modern claim that the Roman Legions were sometimes paid in salt is baseless.\" Also: \"Historians have found no Roman military payroll records that specify payment in salt rather than coin.\"","sources":["wiki-sal","etymologia"]},{"id":"sitarion","title":"Greek sitērion, grain-pay","type":"parallel","cluster":"cousins","summary":"Greek made its word for pay out of grain, not salt. Naming wages after the staple you were given is not unique to Rome.","evidence":"Greek sitērion \"pay\", etymologically \"provision for grain\", from sitos \"wheat or corn\".","sources":["ety"]},{"id":"wage","title":"Wage","type":"word-form","cluster":"cousins","when":"c. 1300","summary":"Salary's everyday rival has a completely different ancestry: a Germanic word for a pledge, not a Latin word for salt.","evidence":"c. 1300 \"a payment for services rendered, reward\"; also \"a pledge, guarantee, surety\"; from Frankish *wadja-.","sources":["wage"],"start":"1300"}],"edges":[{"source":"pie-salt","target":"sal","label":"descended into","kind":"explicit","sources":["pie"]},{"source":"pie-salt","target":"greek-hals","label":"descended into","kind":"explicit","sources":["pie"]},{"source":"pie-salt","target":"english-salt","label":"via Germanic into","kind":"explicit","sources":["pie"]},{"source":"sal","target":"salarius","label":"base of","kind":"explicit","sources":["wikt-la","wikt-en"]},{"source":"salarius","target":"salarium","label":"turned into noun","kind":"explicit","sources":["wikt-la"]},{"source":"sal","target":"via-salaria","label":"names","kind":"explicit","sources":["wiki-via"]},{"source":"via-salaria","target":"salarium","label":"same salt world as","kind":"inferred"},{"source":"salarium","target":"stipendium","label":"glossed alongside","kind":"explicit","sources":["wikt-la"]},{"source":"sitarion","target":"salarium","label":"parallel to","kind":"explicit","sources":["ety"]},{"source":"salarium","target":"salarium-argentum","label":"assumed short for","kind":"explicit","sources":["wikt-en"]},{"source":"salarium","target":"salt-allowance","label":"perhaps meant","kind":"explicit","sources":["wiki-hs"]},{"source":"salarium-argentum","target":"salt-allowance","label":"would mean","kind":"inferred"},{"source":"pliny-dispute","target":"salarium","label":"is cited for","kind":"explicit","sources":["etymologia","cover"]},{"source":"pliny-dispute","target":"no-salt-pay","label":"is misread to deny","kind":"inferred"},{"source":"no-salt-pay","target":"salt-allowance","label":"leaves only","kind":"explicit","sources":["wiki-sal"]},{"source":"salarium","target":"worth-salt","label":"gave rise to","kind":"explicit","sources":["wiki-sal"]},{"source":"salarium","target":"old-french","label":"became","kind":"explicit","sources":["ety","wikt-la"]},{"source":"old-french","target":"anglo-french","label":"carried to England as","kind":"explicit","sources":["ety"]},{"source":"anglo-french","target":"english-13c","label":"borrowed as","kind":"explicit","sources":["ety"]},{"source":"english-13c","target":"verb-caxton","label":"then also a verb","kind":"explicit","sources":["ety"]},{"source":"verb-caxton","target":"honorary","label":"then adjective, against","kind":"explicit","sources":["ety"]},{"source":"honorary","target":"salaried-hourly","label":"later opposed to hourly","kind":"explicit","sources":["ety"]},{"source":"english-13c","target":"salary","label":"narrowed to","kind":"explicit","sources":["ety"]},{"source":"medieval-rare","target":"office-work","label":"gave way to","kind":"inferred"},{"source":"office-work","target":"salaried-hourly","label":"made salary fit","kind":"explicit","sources":["wiki-sal"]},{"source":"salaried-hourly","target":"salary","label":"shapes today's sense of","kind":"inferred"},{"source":"office-work","target":"salaryman","label":"also produced","kind":"explicit","sources":["wiki-sal"]},{"source":"salary","target":"salaryman","label":"lent to Japan as","kind":"explicit","sources":["salaryman","ety"]},{"source":"wage","target":"salaried-hourly","label":"the hourly side of","kind":"explicit","sources":["ety","wage"]},{"source":"beer-rations","target":"medieval-rare","label":"early pay in kind, like","kind":"inferred"},{"source":"stipendium","target":"salary","label":"English stipend, sibling of","kind":"inferred"}],"stories":[{"id":"salt-to-payslip","title":"From salt to payslip","summary":"The main lineage: a root for salt becomes a Roman adjective, a Roman noun, a French word, an English word, and finally the number on an offer letter.","steps":["pie-salt","sal","salarius","salarium","old-french","anglo-french","english-13c","verb-caxton","honorary","salaried-hourly","salary"]},{"id":"paid-in-salt","title":"Were soldiers paid in salt?","summary":"The famous story versus what the sources can support: the word is about salt, the payment probably was not.","steps":["salarium","salarium-argentum","salt-allowance","pliny-dispute","no-salt-pay","worth-salt"]},{"id":"desk-job","title":"How salary became a desk job","summary":"Salaried work was rare for centuries. Offices and big firms made it the normal shape of a career, and Japan imported the word along with the idea.","steps":["medieval-rare","office-work","salaried-hourly","salaryman"]},{"id":"other-pay-words","title":"Other words for pay","summary":"Grain, beer, weighed coin and pledges: pay has been named after many things, and salt is just one.","steps":["beer-rations","sitarion","salarium","stipendium","wage"]}]}</script>

  clip.append(sv("rect", { x: x0 - 10, y: 0, width: pw + 20, height: Math.max(Hc, total + 70) })); defs.append(clip); svg.append(defs);
  blocks.forEach((b, i) => {
    svg.append(sv("rect", { class: "tl-lane" + (i % 2 ? " alt" : ""), x: 0, y: b.top, width: W, height: b.h }));
    const lab = sv("text", { class: "tl-lane-label", x: narrow ? x0 : 14, y: b.top + (narrow ? 12 : 24) });
    lab.textContent = b.c.label; lab.setAttribute("fill", colors[b.c.id]); lab.style.fill = colors[b.c.id]; svg.append(lab);
  });
  const grid = sv("g", { "clip-path": "url(#tl-clip)" });
  if (!TL.even) {
    for (const k of makeTicks(TL.v0, TL.v1, Math.max(3, pw / 140))) {
      const tx = x0 + ((k.t - TL.v0) / (TL.v1 - TL.v0)) * pw;
      grid.append(sv("line", { class: "tl-tick", x1: tx, x2: tx, y1: AX - 6, y2: total }));
      const t = sv("text", { class: "tl-tick-label", x: tx, y: AX - 14 }); t.textContent = k.label; grid.append(t);
    }
  } else {
    const t = sv("text", { class: "tl-tick-label", x: x0, y: 22, "text-anchor": "start" }); t.textContent = "Events in order, evenly spaced (not to scale)"; grid.append(t);
  }
  svg.append(grid);
  const layer = sv("g", { "clip-path": "url(#tl-clip)" });
  for (const b of blocks) for (const it of b.items) {
    if (it.row < 0) continue;
    const n = it.n, cy = b.top + hh + 22 + it.row * rowH;
    const dim = !matches(n) || (inStory ? !inStory.has(n.id) : (sel && n !== sel && !nb.has(n.id)));
    const g = sv("g", { class: "tl-node" + (dim ? " dim" : "") + (n === sel ? " sel" : ""), tabindex: 0, role: "button", "data-id": n.id, "aria-label": `${n.title}, ${n.when || n.start}` });
    const tt = sv("title"); tt.textContent = `${n.title}${n.when ? " (" + n.when + ")" : ""}`; g.append(tt);
    if (!TL.even && it.xe - it.x > 3) g.append(sv("rect", { class: "tl-bar", x: it.x, y: cy - 3, width: it.xe - it.x, height: 6, rx: 3, fill: n.color }));
    g.append(sv("circle", { class: "tl-dot", cx: it.x, cy, r: n.featured ? 7 : 5.5, fill: n.color }));
    const tx = it.flip ? it.x - 12 : Math.max(it.x, it.xe) + 12;
    const t = sv("text", { x: tx, y: cy + 4, "text-anchor": it.flip ? "end" : "start" }); t.textContent = n.title; g.append(t);
    if (TL.even && n.when) { const w = sv("text", { class: "tl-when", x: tx, y: cy + 16, "text-anchor": it.flip ? "end" : "start" }); w.textContent = n.when; g.append(w); }
    g.addEventListener("click", () => select(n.id));
    g.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(n.id); } });
    layer.append(g);
  }

  $("tl-mode").textContent = TL.even ? "True scale" : "Even spacing";
}
(function timelineInput() {
  const svg = $("tl"); let d = null; const pts = new Map(); let pinch = 0;

  svg.addEventListener("wheel", (e) => { if (TL.even) return; e.preventDefault(); const r = svg.getBoundingClientRect(); tlZoom(Math.exp(e.deltaY * 0.0015), e.clientX - r.left); }, { passive: false });
  svg.addEventListener("pointerdown", (e) => {

  });

})();

/* ----- read: guided stories as a narrative ----- */
function showStep(sid, i) { setView("graph"); startStory(sid); goStep(i); }

  const box = $("read"); box.textContent = "";

  const st = storyById.get(S.readStory) || all[0]; S.readStory = st.id;
  const wrap = el("div", { class: "read-wrap" });
  wrap.append(el("div", { class: "read-tabs" }, all.map((s) => el("button", { class: "chip", "aria-pressed": String(s.id === st.id), text: s.title, onclick: () => { S.readStory = s.id; renderRead(); box.scrollTop = 0; } }))));
  wrap.append(el("h2", { class: "rt", text: st.title }));
  if (st.summary) wrap.append(el("p", { class: "intro", text: st.summary }));
  st.steps.forEach((id, i) => {
    const n = byId.get(id), prev = i ? byId.get(st.steps[i - 1]) : null;
    const e = prev ? edges.find((x) => (x.a === prev && x.b === n) || (x.a === n && x.b === prev)) : null;
    const srcs = (n.sources || []).map((s) => srcById.get(s)).filter(Boolean);

      el("span", { class: "rnum", text: String(i + 1) }),
      e ? el("p", { class: "via" }, `${e.a.title} `, el("em", { text: `${e.label} →` }), ` ${e.b.title}`, e.kind === "inferred" ? " (inferred)" : "") : null,
      el("h3", null, el("button", { text: n.title, onclick: () => select(n.id) })),

      el("p", { text: n.summary }),

      n.evidence ? el("blockquote", { text: n.evidence }) : null,
      srcs.length ? el("p", { class: "rsrc" }, "Sources: ", srcs.flatMap((s, k) => { const u = safeUrl(s.url); return [k ? ", " : "", u ? el("a", { href: u, target: "_blank", rel: "noopener noreferrer", text: s.title }) : s.title]; })) : null,
      el("p", null, el("button", { class: "chip", text: "Show on graph", onclick: () => showStep(st.id, i) }))));
  });

}

/* ----- outline: the graph as a collapsible tree from the root ----- */
const tree = (() => {
  const nbrs = new Map(nodes.map((n) => [n.id, []]));
  for (const e of [...edges].sort((a, b) => (a.kind === "explicit" ? 0 : 1) - (b.kind === "explicit" ? 0 : 1))) { nbrs.get(e.source).push([e.target, e]); nbrs.get(e.target).push([e.source, e]); }
  const parent = new Map([[story.root, null]]), kids = new Map(nodes.map((n) => [n.id, []])), q = [story.root];
  while (q.length) { const id = q.shift(); for (const [o, e] of nbrs.get(id)) if (!parent.has(o)) { parent.set(o, { id, e }); kids.get(id).push(o); q.push(o); } }

})();
S.open.add(story.root);

    el("button", { class: "btn", text: "Expand all", onclick: () => { nodes.forEach((n) => S.open.add(n.id)); renderOutline(); } }),
    el("button", { class: "btn", text: "Collapse all", onclick: () => { S.open.clear(); S.open.add(story.root); renderOutline(); } })));
  const item = (n) => {
    const kids = tree.kids.get(n.id), p = tree.parent.get(n.id), dim = !matches(n);
    const head = [
      el("i", { style: `--c:${n.color}` }),
      p ? el("span", { class: "via", text: `${p.e.a.id === p.id ? "→" : "←"} ${p.e.label}` }) : null,
      el("button", { class: "olt", text: n.title, onclick: (ev) => { ev.preventDefault(); ev.stopPropagation(); select(n.id); } }),
      el("small", { text: [cap(n.type), n.when].filter(Boolean).join(" · ") }),
    ];
    const also = edges.filter((e) => (e.a === n || e.b === n) && !tree.treeEdges.has(e)).slice(0, 8);
    const body = el("div", { class: "olbody" }, el("p", { text: n.summary }),
      also.length ? el("p", null, "Also: ", also.flatMap((e, k) => { const o = e.a === n ? e.b : e.a; return [k ? "  ·  " : "", el("button", { class: "olink", text: `${e.a === n ? "→" : "←"} ${e.label} ${o.title}`, onclick: () => select(o.id) })]; })) : null);
    if (!kids.length) return el("li", { class: dim ? "dim" : "" }, el("div", { class: "row" }, head), body);
    return el("li", { class: dim ? "dim" : "" },
      el("details", { open: S.open.has(n.id), ontoggle: (ev) => { if (ev.target.open) S.open.add(n.id); else S.open.delete(n.id); } },
        el("summary", { class: "row" }, head, el("span", { class: "olcount", text: String(kids.length) })), body,

  };
  wrap.append(el("ul", null, item(byId.get(story.root))));
  if (tree.orphans.length) wrap.append(el("h3", { text: "Not connected to the root", style: "margin:24px 0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)" }), el("ul", null, tree.orphans.map((n) => el("li", null, el("div", { class: "row" }, el("i", { style: `--c:${n.color}` }), el("button", { class: "olt", text: n.title, onclick: () => select(n.id) }), el("small", { text: cap(n.type) }))))));
  box.append(wrap);
}

/* ----- switching ----- */
function setView(v) {
  if (!viewList.includes(v)) v = viewList[0];
  const was = S.view; S.view = v;
  for (const key of ["list", "timeline", "read", "outline"]) $(key).classList.toggle("on", v === key);
  svgEl.style.visibility = v === "graph" ? "visible" : "hidden";
  const spatial = v === "graph" || v === "timeline";
  $("zoom").style.display = spatial ? "" : "none";
  $("zoom").classList.toggle("right", v === "timeline");
  $("btn-fit").style.display = spatial ? "" : "none";
  $("chips").style.display = v === "read" ? "none" : "";
  $("stories").style.display = spatial ? "" : "none";
  if (!spatial && S.story) endStoryQuiet();
  for (const b of $("views").children) b.setAttribute("aria-pressed", String(b.dataset.v === v));
  if (v === "read") renderRead();
  render();
  if (v === "graph" && was !== "graph") requestAnimationFrame(() => { if (!touched) fit(false); });
  if (v === "timeline") requestAnimationFrame(renderTimeline);
}

/* ---------- toolbar ---------- */
const usedClusters = new Set(nodes.map((n) => n.cluster));
$("chips").append(el("button", { class: "chip", "data-c": "all", text: "All", onclick: () => { S.filter = "all"; render(); } }));
for (const c of story.clusters) if (usedClusters.has(c.id)) $("chips").append(el("button", { class: "chip", "data-c": c.id, style: `--c:${colors[c.id]}`, onclick: () => { S.filter = S.filter === c.id ? "all" : c.id; render(); } }, el("i"), c.label));
if ((story.stories || []).length) {
  $("stories").append(el("span", { text: "Follow a story" }));
  for (const s of story.stories) $("stories").append(el("button", { class: "chip", "data-s": s.id, title: s.summary || "", text: s.title, onclick: () => (S.story && S.story.id === s.id ? endStory() : startStory(s.id)) }));
}
for (const c of story.clusters) if (usedClusters.has(c.id)) $("legend").append(el("span", { style: `--c:${colors[c.id]}` }, el("i"), c.label));
$("legend").append(el("span", { title: "Relationship directly supported by a cited source" }, (() => { const s = sv("svg", { viewBox: "0 0 22 8" }); s.append(sv("line", { x1: 0, y1: 4, x2: 22, y2: 4, stroke: "currentColor", "stroke-width": 1.5 })); return s; })(), "sourced"));
$("legend").append(el("span", { title: "Editorial bridge: an interpretation, not a direct claim" }, (() => { const s = sv("svg", { viewBox: "0 0 22 8" }); s.append(sv("line", { x1: 0, y1: 4, x2: 22, y2: 4, stroke: "currentColor", "stroke-width": 1.5, "stroke-dasharray": "3 4" })); return s; })(), "inferred"));

$("views").append(...viewList.map((v) => el("button", { "data-v": v, "aria-pressed": "false", text: VIEW_LABEL[v], onclick: () => setView(v) })));
if (viewList.length < 2) $("views").style.display = "none";
$("q").addEventListener("input", (e) => { S.q = e.target.value.trim().toLowerCase(); render(); });
$("btn-fit").onclick = () => { if (S.view === "timeline") { tlReset(); renderTimeline(); } else fit(); };
$("btn-reset").onclick = () => { S.filter = "all"; S.q = ""; $("q").value = ""; endStoryQuiet(); tlReset(); layout(); place(); select(null); fit(); };
$("zin").onclick = () => (S.view === "timeline" ? tlZoom(1 / 1.4, (TL.geo ? TL.geo.x0 + TL.geo.pw / 2 : 0)) : zoomAt(1.3, svgEl.clientWidth / 2, svgEl.clientHeight / 2));
$("zout").onclick = () => (S.view === "timeline" ? tlZoom(1.4, (TL.geo ? TL.geo.x0 + TL.geo.pw / 2 : 0)) : zoomAt(1 / 1.3, svgEl.clientWidth / 2, svgEl.clientHeight / 2));
$("sb-prev").onclick = () => goStep(S.step - 1); $("sb-next").onclick = () => goStep(S.step + 1); $("sb-exit").onclick = endStory;
addEventListener("keydown", (e) => {
  const typing = e.target.tagName === "INPUT";
  if (e.key === "/" && !typing) { e.preventDefault(); $("q").focus(); }
  else if (e.key === "Escape") { if (typing) e.target.blur(); else if (S.selected) select(null); else if (S.story) endStory(); }
  else if (S.story && !typing && e.key === "ArrowRight") goStep(S.step + 1);
  else if (S.story && !typing && e.key === "ArrowLeft") goStep(S.step - 1);
});

/* ---------- pointer interaction: pan, zoom, pinch, drag nodes ---------- */
const ptrs = new Map(); let drag = null;

  drag = g ? { type: "node", n: byId.get(g.dataset.id), sx: e.clientX, sy: e.clientY, moved: false }
           : { type: "pan", sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, moved: false };

  if (drag.type === "pan") { view.x = drag.vx + dx; view.y = drag.vy + dy; applyView(); }

svgEl.addEventListener("pointerup", endPtr); svgEl.addEventListener("pointercancel", endPtr);
svgEl.addEventListener("wheel", (e) => { e.preventDefault(); const r = svgEl.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
let sized = svgEl.clientWidth > 0 && svgEl.clientHeight > 0, touched = false;
svgEl.addEventListener("pointerdown", () => { touched = true; }); svgEl.addEventListener("wheel", () => { touched = true; }, { passive: true });
const onSize = () => {
  if (S.view === "timeline") { renderTimeline(); return; }
  if (S.view !== "graph" || !svgEl.clientWidth || !svgEl.clientHeight) return;
  if (!sized) { sized = true; layout(); place(); fit(false); return; } // first real size (page was loaded hidden / zero-sized)
  if (!touched && !S.selected && !S.story) fit(false);
};
if (window.ResizeObserver) { new ResizeObserver(onSize).observe(svgEl); new ResizeObserver(() => { if (S.view === "timeline") renderTimeline(); }).observe($("timeline")); } else addEventListener("resize", onSize);

/* ---------- boot ---------- */
layout(); place(); setView(viewList.includes(story.defaultView) ? story.defaultView : "graph"); fit(false);
function fromHash() {
  const m = /#(node|story|view)=([^&]+)/.exec(location.hash); if (!m) return;
  const id = decodeURIComponent(m[2]);
  if (m[1] === "view") { if (S.view !== id) setView(id); return; }
  if (m[1] === "node" && byId.has(id) && S.selected !== id) select(id, { center: true });
  else if (m[1] === "story" && storyById.has(id) && !(S.story && S.story.id === id)) startStory(id);
}
addEventListener("hashchange", fromHash);
fromHash();
})();
