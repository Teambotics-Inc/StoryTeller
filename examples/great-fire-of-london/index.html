.views button[aria-pressed=true]{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}

.tl-lane.alt{opacity:.015}
.tl-lane-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;fill:var(--muted)}
.tl-tick{stroke:var(--line);stroke-dasharray:2 5}
.tl-tick-label{font-size:10px;fill:var(--muted);text-anchor:middle}
.tl-node{cursor:pointer}
.tl-node text{font-size:11px;fill:var(--text);paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round}
.tl-node .tl-when{font-size:9px;fill:var(--muted)}
.tl-node .tl-dot{stroke:var(--bg);stroke-width:1.5}
.tl-node.sel .tl-dot{stroke:var(--accent);stroke-width:3}
.tl-node:focus-visible{outline:none}
.tl-node:focus-visible .tl-dot{stroke:var(--accent);stroke-width:3}

.tl-bar{opacity:.5}

.read-wrap{max-width:720px;margin:0 auto}
.read-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:26px}

.rstep h3{margin:0 0 2px;font-size:21px;line-height:1.25}
.rstep h3 button{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit}

.ol-wrap .row{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding:6px 6px;list-style:none}

.ol-wrap summary.row::before{content:"+";color:var(--muted);width:12px;flex:none}

.ol-wrap .via{font-size:11px;color:var(--accent)}
.ol-wrap .olt{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--text);text-align:left}
.ol-wrap .olt:hover{color:var(--accent)}
.ol-wrap small{color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.ol-wrap .olcount{margin-left:auto;font-size:11px;color:var(--muted)}
.ol-wrap .olbody{padding:0 6px 8px 26px;color:var(--muted);font-size:13px}

#panel{position:absolute;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:22px 22px 40px;transform:translateX(102%);transition:transform .25s ease,visibility 0s linear .25s;z-index:6;box-shadow:-12px 0 40px rgba(0,0,0,.25)}

.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:2px 8px;border:1px solid var(--line);font-size:11px;color:var(--muted)}
.links{list-style:none;margin:0;padding:0;display:grid;gap:6px}

#storybar{z-index:7;position:absolute;left:50%;bottom:54px;transform:translateX(-50%);width:min(560px,calc(100% - 32px));background:var(--surface);border:1px solid var(--accent);padding:10px 14px;display:none;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;z-index:5;box-shadow:0 10px 40px rgba(0,0,0,.35)}

noscript{display:block;padding:24px;max-width:760px}

@media (max-width:760px){
  header{padding:14px 16px 10px;flex-direction:column}

</style>

<noscript><h1>The Great Fire of London</h1><p>Five days in September 1666 on a timeline: how a bakery fire in a dry wooden city became a catastrophe, who was blamed, and what London did next.</p><p>This interactive story graph needs JavaScript. The full content follows.</p><ul><li><strong>The Great Fire of London</strong>: A fire that began in a baker&#39;s house in Pudding Lane on Sunday 2 September 1666 and consumed most of the medieval City within days, the rest of this map is organised around it.</li><li><strong>The Great Plague</strong>: London&#39;s last major plague epidemic ended the year before the fire, leaving a weary, poorer city; it was not cured by the fire.</li><li><strong>A city of timber and pitch</strong>: Close-packed wooden houses, thatch and pitch, with warehouses of oil, tar and brandy by the river, gave the fire fuel at every step.</li><li><strong>The dry summer of 1666</strong>: After a long dry spell, wood, thatch and even stone were primed to burn, and water was scarce.</li><li><strong>Firefighting in 1666</strong>: There was no organised fire brigade: parishes kept buckets, hooks and hand squirts, and the main tactic was pulling houses down to starve a fire.</li><li><strong>Farriner&#39;s bakery, Pudding Lane</strong>: The fire broke out in the house and bakery of the King&#39;s baker around one in the morning; nobody can say for certain how.</li><li><strong>Sunday 2 September</strong>: Day one: Pepys is told of a fire, goes back to bed, then by mid-morning sees London Bridge&#39;s end burning and rows to Whitehall to warn the King.</li><li><strong>Monday 3 September</strong>: Day two: Londoners flee with carts and boats, hope fades, and suspicion falls on foreigners; the Duke of York takes charge.</li><li><strong>Tuesday 4 September</strong>: Day three: the fire reaches Fleet Street and old St Paul&#39;s; gunpowder is first used to blow gaps in its path.</li><li><strong>Wednesday 5 September</strong>: Day four: the wind drops, the blown-up gaps hold, and Pepys climbs a steeple to see the ruin.</li><li><strong>Thursday 6 September</strong>: Day five: embers flare again at the Temple and Bishopsgate, but the great fire is over; rumours of a plot are still circulating.</li><li><strong>A strong east wind</strong>: The wind blew the flames westward into the City from the first night and only fell on Tuesday night, which is why the fire ended when it did.</li><li><strong>Lord Mayor Bludworth</strong>: The Lord Mayor, Sir Thomas Bludworth, hesitated over pulling houses down and told Pepys the fire was beyond him.</li><li><strong>Firebreaks and gunpowder</strong>: Pulling houses down by hand was too slow; blowing them up with gunpowder, begun on the third day, made gaps wide enough to stop the flames.</li><li><strong>Samuel Pepys</strong>: A Navy official whose diary gives the best hour-by-hour account, from his first dismissal of the fire to burying his wine and cheese.</li><li><strong>John Evelyn</strong>: A diarist and Royal Society fellow who watched from Southwark and Whitehall, and then drew up a plan to rebuild London.</li><li><strong>The London Gazette, no. 85</strong>: The government newspaper&#39;s official account, printed after the fire destroyed its press premises, treats the fire as an accident and mentions arrests of foreigners.</li><li><strong>Charles II and the Duke of York</strong>: The King sent Pepys with orders to demolish; his brother James, Duke of York, patrolled with his guards and took charge of the response.</li><li><strong>Thomas Farriner</strong>: The King&#39;s baker, whose house was the first to burn; some sources spell the surname Farynor, and the maid in the house is said to have died.</li><li><strong>How much burned</strong>: Most sources agree on about 13,200 houses, 87 churches and the cathedral, the Guildhall and the Royal Exchange; the proportion of the City lost is more loosely quoted.</li><li><strong>Counting the damage</strong>: Sources do not agree on percentages or even the church count, which shows how rough the numbers behind the story are.</li><li><strong>How many died?</strong>: The recorded death toll is tiny for such a fire, but sources give six, nine, or fewer than ten, and some think more went unrecorded.</li><li><strong>Old St Paul&#39;s destroyed</strong>: The medieval cathedral, with its wooden scaffolding and goods stored inside, burned on the third night and its stones flew.</li><li><strong>Suspicion of foreigners</strong>: Londoners at war with the Dutch and French blamed foreigners; mobs attacked them and the Gazette itself reports arrests.</li><li><strong>Robert Hubert&#39;s confession</strong>: A French watchmaker&#39;s son confessed to starting the fire; his story did not fit the facts, but he was indicted.</li><li><strong>Hubert hanged at Tyburn</strong>: He was executed on his confession even though the authorities largely accepted the fire was an accident.</li><li><strong>The official verdict: an accident</strong>: The government&#39;s own account concluded the fire was an unhappy chance, or divine judgement, not a plot.</li><li><strong>The Monument&#39;s inscription</strong>: In 1681 words blaming a &#39;popish faction&#39; were added to the Monument; they were removed in 1830.</li><li><strong>Hollar&#39;s survey</strong>: On 10 September the King ordered an exact survey of the ruins; Wenceslaus Hollar&#39;s 1667 plan shows the burnt area as white.</li><li><strong>Wren&#39;s plan</strong>: Christopher Wren proposed wide streets, squares and a canal on the Fleet, six days after the fire ended; it was never built.</li><li><strong>Evelyn&#39;s plan</strong>: John Evelyn showed his own plan to the King two days later, also with broad vistas; also never built.</li><li><strong>Charles II&#39;s declaration</strong>: The King declared that houses would be rebuilt in brick or stone, not timber.</li><li><strong>Rebuilding of London Act</strong>: Parliament required brick or stone fronts and four set sorts of building, and widened streets, while keeping the old street plan.</li><li><strong>The Fire Court</strong>: An emergency court settled disputes between landlords and tenants over who should pay to rebuild.</li><li><strong>The Monument</strong>: A fluted column near Pudding Lane that the Act ordered, as high as it is far from the bakery.</li><li><strong>St Paul&#39;s rebuilt</strong>: The ruined cathedral was demolished and Wren&#39;s replacement begun about nine years after the fire.</li><li><strong>Fire insurance begins</strong>: The first property insurance office opened in 1680 and insurers soon employed their own brigades.</li></ul></noscript>

that began in a baker's house in Pudding Lane on Sunday 2 September 1666 and consumed most of the medieval City within days, the rest of this map is organised around it.","start":"1666-09-02","end":"1666-09-05","when":"2 September to 5 September 1666 (some sources say 6 September)","featured":true,"details":"Sources disagree on how long it lasted: the Monument says it burned four days and ended on Wednesday 5 September; Royal Museums Greenwich counts 2 to 6 September, five days; the Science Museum says nearly five days. The map keeps both ends visible rather than choosing.","evidence":"\"ending on Wednesday 5th September 1666\" (The Monument, FAQs)","sources":["mon-faq","rmg-fire","sci","lm-fire"]},{"id":"plague","title":"The Great Plague","type":"event","cluster":"before","summary":"London's last major plague epidemic ended the year before the fire, leaving a weary, poorer city; it was not cured by the fire.","start":"1665","end":"1666","when":"1665 (all but over by summer 1666)","evidence":"\"Lord! How empty the streets are and how melancholy\" (Pepys, 1665, quoted by the London Museum)","details":"Counts differ by a digit: Royal Museums Greenwich gives 68,595 official plague deaths in London in 1665 and says the true figure is probably nearer 100,000; a London Museum spoon is inscribed with 68,596. The Monument stresses that people kept dying of plague after 1666, so the fire did not end it.","sources":["rmg-plague","lm-plague","mon-faq"]},{"id":"timber-city","title":"A city of timber and pitch","type":"concept","cluster":"before","summary":"Close-packed wooden houses, thatch and pitch, with warehouses of oil, tar and brandy by the river, gave the fire fuel at every step.","evidence":"\"pitch and tarr, in Thames-street; and warehouses of oyle, and wines, and brandy\" (Pepys, 2 Sept)","details":"The London Fire Brigade Museum describes timber houses covered in pitch, thatched roofs, overhanging upper floors almost touching across lanes, and about 350,000 people in the city.","sources":["lfb","pepys-02"]},{"id":"drought","title":"The dry summer of 1666","type":"condition","cluster":"before","summary":"After a long dry spell, wood, thatch and even stone were primed to burn, and water was scarce.","start":"1666","when":"summer 1666","evidence":"\"every thing, after so long a drought, proving combustible, even the very stones of churches\" (Pepys, 2 Sept)","sources":["lfb","pepys-02","sci"]},{"id":"firefighting","title":"Firefighting in 1666","type":"practice","cluster":"before","summary":"There was no organised fire brigade: parishes kept buckets, hooks and hand squirts, and the main tactic was pulling houses down to starve a fire.","evidence":"Leather buckets, axes and water squirts \"had little effect\" (London Fire Brigade Museum)","details":"The Gazette's own account says the fire \"became too big to be mastered by any Engines or working neer it\". Each parish was meant to keep water buckets and hooks to pull down buildings (London Museum).","sources":["lfb","lm-fire","gaz85"]},{"id":"bakery","title":"Farriner's bakery, Pudding Lane","type":"event","cluster":"days","summary":"The fire broke out in the house and bakery of the King's baker around one in the morning; nobody can say for certain how.","start":"1666-09-02","when":"2 September 1666, about 1am","featured":true,"details":"Start time: the Gazette says \"one of the clock in the Morning\"; the Fire Brigade Museum and London Museum say about 1am; the British Library says \"shortly after midnight\". Cause: the Monument says Farriner is believed to have put his fire out and a spark from the oven hit fuel; The National Archives' teaching notes say he did not put the oven fire out; the London Museum says \"We can't know for sure how the fire started\".","evidence":"\"On the second instant at one of the clock in the Morning\" (London Gazette, issue 85)","sources":["gaz85","lfb","lm-fire","bl-hubert","mon-faq","tna"]},{"id":"sep2","title":"Sunday 2 September","type":"day","cluster":"days","summary":"Day one: Pepys is told of a fire, goes back to bed, then by mid-morning sees London Bridge's end burning and rows to Whitehall to warn the King.","start":"1666-09-02","when":"Sunday 2 September 1666","evidence":"\"being unused to such fires as followed, I thought it far enough off\" (Pepys)","details":"The wind drove flames west from Pudding Lane through Fish Street and Thames Street, reaching the river-side warehouses and the Steelyard that morning.","sources":["pepys-02","gaz85"]},{"id":"sep3","title":"Monday 3 September","type":"day","cluster":"days","summary":"Day two: Londoners flee with carts and boats, hope fades, and suspicion falls on foreigners; the Duke of York takes charge.","start":"1666-09-03","when":"Monday 3 September 1666","evidence":"\"the streets and the highways are crowded with people running and riding\" (Pepys)","sources":["pepys-03","evelyn","rmg-fire"]},{"id":"sep4","title":"Tuesday 4 September","type":"day","cluster":"days","summary":"Day three: the fire reaches Fleet Street and old St Paul's; gunpowder is first used to blow gaps in its path.","start":"1666-09-04","when":"Tuesday 4 September 1666","evidence":"\"Now begins the practice of blowing up of houses in Tower-streete\" (Pepys)","sources":["pepys-04","evelyn","rmg-fire"]},{"id":"sep5","title":"Wednesday 5 September","type":"day","cluster":"days","summary":"Day four: the wind drops, the blown-up gaps hold, and Pepys climbs a steeple to see the ruin.","start":"1666-09-05","when":"Wednesday 5 September 1666","evidence":"\"the saddest sight of desolation that I ever saw\" (Pepys)","details":"The Gazette reports that by Wednesday morning \"we began to hope well\" and a stop was put to the fire at a line of points from the Temple Church round to the Tower dock. The Monument gives 5 September as the day the fire ended.","sources":["pepys-05","gaz85","mon-faq","evelyn"]},{"id":"sep6","title":"Thursday 6 September","type":"day","cluster":"days","summary":"Day five: embers flare again at the Temple and Bishopsgate, but the great fire is over; rumours of a plot are still circulating.","start":"1666-09-06","when":"Thursday 6 September 1666","evidence":"\"Cloathworkers’ Hall on fire these three days and nights in one body of flame\" (Pepys)","details":"Royal Museums Greenwich counts the fire as running to 6 September; the Gazette says Thursday brought it \"wholy beat down and extinguished\" before it \"unhappily burst out again\" at the Temple that evening.","sources":["pepys-06","gaz85","rmg-fire"]},{"id":"east-wind","title":"A strong east wind","type":"condition","cluster":"spread","summary":"The wind blew the flames westward into the City from the first night and only fell on Tuesday night, which is why the fire ended when it did.","start":"1666-09-02","end":"1666-09-05","when":"from 2 September until the night of 4 September","evidence":"\"a violent Easterly wind fomented it\" (London Gazette, issue 85)","details":"Evelyn has the fury of the fire abating about noon on Wednesday. Royal Museums Greenwich says the wind turned south and then died down just before midnight on Tuesday 4 September.","sources":["gaz85","rmg-fire","pepys-02"]},{"id":"bludworth","title":"Lord Mayor Bludworth","type":"person","cluster":"spread","summary":"The Lord Mayor, Sir Thomas Bludworth, hesitated over pulling houses down and told Pepys the fire was beyond him.","start":"1666-09-02","when":"2 September 1666","evidence":"\"Lord! what can I do? I am spent: people will not obey me.\" (Pepys, quoting Bludworth)","details":"Royal Museums Greenwich says he was afraid to order houses pulled down and attributes to him a dismissive quip that the fire was so weak a woman could put it out; that remark is not in Pepys's entry. Evelyn blamed 'tenacious and avaricious' aldermen for refusing early demolition; that is Evelyn's claim.","sources":["pepys-02","rmg-fire","evelyn","lm-fire"]},{"id":"firebreaks","title":"Firebreaks and gunpowder","type":"tactic","cluster":"spread","summary":"Pulling houses down by hand was too slow; blowing them up with gunpowder, begun on the third day, made gaps wide enough to stop the flames.","start":"1666-09-04","end":"1666-09-05","when":"from Tuesday 4 September 1666","evidence":"\"unless his Majesty did command houses to be pulled down nothing could stop the fire\" (Pepys, 2 Sept)","details":"The Gazette notes orders 'about the Tower' to pull down houses to secure the powder magazines there. The London Museum says gunpowder was used on the third day.","sources":["pepys-02","pepys-04","pepys-05","gaz85","lm-fire"]},{"id":"pepys","title":"Samuel Pepys","type":"person","cluster":"voices","summary":"A Navy official whose diary gives the best hour-by-hour account, from his first dismissal of the fire to burying his wine and cheese.","evidence":"\"I down to the water-side, and there got a boat and through bridge, and there saw a lamentable fire.\" (2 Sept)","details":"His diary text is the main primary source here; it is read on pepysdiary.com from the Wheatley-edition text.","sources":["pepys-02","pepys-03","pepys-04","pepys-05"]},{"id":"evelyn","title":"John Evelyn","type":"person","cluster":"voices","summary":"A diarist and Royal Society fellow who watched from Southwark and Whitehall, and then drew up a plan to rebuild London.","evidence":"\"London was, but is no more!\" (3 Sept)","sources":["evelyn","lm-wren","sci"]},{"id":"gazette","title":"The London Gazette, no. 85","type":"document","cluster":"voices","summary":"The government newspaper's official account, printed after the fire destroyed its press premises, treats the fire as an accident and mentions arrests of foreigners.","start":"1666-09-03","end":"1666-09-10","when":"issue covering 3 to 10 September 1666","evidence":"\"an effect of an unhappy chance\" (London Gazette, issue 85)","details":"The page is a scan with no text layer, so the quotation was transcribed by eye; it also blames 'the heavy hand of God' for our sins. Its printing premises at Baynard's Castle were destroyed and it reappeared on 10 September printed at the Savoy.","sources":["gaz85","gaz-note"]},{"id":"royal-brothers","title":"Charles II and the Duke of York","type":"people","cluster":"voices","summary":"The King sent Pepys with orders to demolish; his brother James, Duke of York, patrolled with his guards and took charge of the response.","start":"1666-09-02","when":"from 2 September 1666","evidence":"Duke of York \"did ride with his guard up and down the City, to keep all quiet\" (Pepys, 3 Sept)","sources":["pepys-02","pepys-03","rmg-fire"]},{"id":"farriner","title":"Thomas Farriner","type":"person","cluster":"voices","summary":"The King's baker, whose house was the first to burn; some sources spell the surname Farynor, and the maid in the house is said to have died.","evidence":"\"Thomas Farriner escaped blame.\" (London Museum)","details":"Royal Museums Greenwich says the family escaped through an upper window and the maid, too frightened to leave, perished. The National Archives' notes say the maid was the first to die.","sources":["lm-fire","rmg-fire","tna"]},{"id":"scale","title":"How much burned","type":"outcome","cluster":"toll","summary":"Most sources agree on about 13,200 houses, 87 churches and the cathedral, the Guildhall and the Royal Exchange; the proportion of the City lost is more loosely quoted.","start":"1666-09","when":"September 1666","evidence":"\"436 acres of London were destroyed, including 13,200 houses and 87 churches\" (The Monument)","details":"The London Fire Brigade Museum and London Museum give 13,200 houses and 87 churches; the cost was put at about £10 million in later estimates.","sources":["mon-faq","lfb","lm-fire","rmg-fire"],"featured":true},{"id":"scale-dispute","title":"Counting the damage","type":"disagreement","cluster":"toll","summary":"Sources do not agree on percentages or even the church count, which shows how rough the numbers behind the story are.","details":"Churches: 87 in most sources; the Gazette's anniversary page says '90 churches'. Share of the City destroyed: 80% of the old City (British Library), 85% of the City (Royal Museums Greenwich), four-fifths of the city within the walls (Science Museum). Livery halls: 52 (Royal Museums Greenwich) or 44 (Science Museum). Homeless: 100,000 (several). The Monument says almost 85% of London's population were left homeless, which is a different measure. This map does not choose.","evidence":"\"over 13,000 houses, 90 churches\" (The Gazette, anniversary note)","sources":["gaz-note","bl-hubert","rmg-fire","sci","mon-faq"]},{"id":"deaths","title":"How many died?","type":"disagreement","cluster":"toll","summary":"The recorded death toll is tiny for such a fire, but sources give six, nine, or fewer than ten, and some think more went unrecorded.","evidence":"\"just six people were officially recorded to have lost their lives\" (The Monument)","details":"The National Archives' teaching notes say \"only nine people died\"; the London Museum says \"Fewer than 10 people are recorded to have died\". The Monument and Royal Museums Greenwich both note that many deaths may have gone unrecorded.","sources":["mon-faq","tna","lm-fire","rmg-fire"]},{"id":"st-pauls","title":"Old St Paul's destroyed","type":"event","cluster":"toll","summary":"The medieval cathedral, with its wooden scaffolding and goods stored inside, burned on the third night and its stones flew.","start":"1666-09-04","when":"Tuesday 4 September 1666","evidence":"\"the stones of Paul's flew like grenados, the melting lead running down the streets in a stream\" (Evelyn, 4 Sept)","details":"Royal Museums Greenwich says St Paul's was surrounded by fire by 9pm that Tuesday.","sources":["evelyn","rmg-fire","pepys-04"]},{"id":"foreigners","title":"Suspicion of foreigners","type":"rumour","cluster":"blame","summary":"Londoners at war with the Dutch and French blamed foreigners; mobs attacked them and the Gazette itself reports arrests.","start":"1666-09-03","when":"from Monday 3 September 1666","evidence":"\"Divers Strangers, Dutch and French, were, during the fire, apprehended\" (London Gazette, issue 85)","details":"Pepys on 5 September: \"discourse now begun, that there is plot in it, and that the French had done it\". Royal Museums Greenwich says people who looked foreign were attacked or jailed.","sources":["gaz85","pepys-05","rmg-fire","lm-fire"]},{"id":"hubert","title":"Robert Hubert's confession","type":"event","cluster":"blame","summary":"A French watchmaker's son confessed to starting the fire; his story did not fit the facts, but he was indicted.","start":"1666-09-16","when":"indicted 16 September 1666","evidence":"\"poor distracted wretch, weary of his life, and chose to part with it this way\" (Clarendon, quoted by the British Library)","details":"The British Library says a ship's captain's testimony showed Hubert arrived two days after the fire started, and the bakery's owner said it had no windows. The London Museum says he may have suffered mental health problems.","sources":["bl-hubert","lm-fire"]},{"id":"hubert-hanged","title":"Hubert hanged at Tyburn","type":"event","cluster":"blame","summary":"He was executed on his confession even though the authorities largely accepted the fire was an accident.","start":"1666-10-27","when":"27 October 1666","evidence":"\"Hubert had confessed to the crime and was therefore hanged at Tyburn on 27 October 1666.\" (British Library)","sources":["bl-hubert"]},{"id":"accident","title":"The official verdict: an accident","type":"finding","cluster":"blame","summary":"The government's own account concluded the fire was an unhappy chance, or divine judgement, not a plot.","start":"1666-09-08","when":"dated 8 September 1666","evidence":"\"an effect of an unhappy chance\" (London Gazette, issue 85)","details":"The National Archives' notes also say the fire was most likely caused by chance rather than a deliberate act. The Gazette text, a scan, was transcribed by eye.","sources":["gaz85","tna"]},{"id":"inscription","title":"The Monument's inscription","type":"memory","cluster":"blame","summary":"In 1681 words blaming a 'popish faction' were added to the Monument; they were removed in 1830.","start":"1681","when":"added 1681, chiselled out 1830","evidence":"\"begun and carried on by the treachery and malice of the popish faction\" (as quoted on Wikipedia)","details":"Wikipedia says the words were added on the orders of the Court of Aldermen during the Popish Plot; a guide site says removal was ordered by the Court of Common Council on 6 December 1830 (not independently verified here).","sources":["wiki-mon","regency"]},{"id":"hollar","title":"Hollar's survey","type":"document","cluster":"rebuild","summary":"On 10 September the King ordered an exact survey of the ruins; Wenceslaus Hollar's 1667 plan shows the burnt area as white.","start":"1666-09-10","when":"order of 10 September 1666; survey 1667","evidence":"\"an exact plan and survey of our city of London\" (Charles II's order, National Archives transcript)","sources":["tna","lm-fire"]},{"id":"wren-plan","title":"Wren's plan","type":"plan","cluster":"rebuild","summary":"Christopher Wren proposed wide streets, squares and a canal on the Fleet, six days after the fire ended; it was never built.","start":"1666-09-11","when":"11 September 1666","evidence":"Wren submitted his plan \"on 11 September 1666, only six days after the fire was extinguished\" (London Museum)","sources":["lm-wren","sci"]},{"id":"evelyn-plan","title":"Evelyn's plan","type":"plan","cluster":"rebuild","summary":"John Evelyn showed his own plan to the King two days later, also with broad vistas; also never built.","start":"1666-09-13","when":"13 September 1666","evidence":"Evelyn wrote his plan would make London \"the most noble city that can be\" (London Museum)","sources":["lm-wren","sci"]},{"id":"declaration","title":"Charles II's declaration","type":"document","cluster":"rebuild","summary":"The King declared that houses would be rebuilt in brick or stone, not timber.","start":"1666","when":"1666 (day not given in the source)","evidence":"\"no man whatsoever shal presume to erect any House or Building, great or small, but of Brick or Stone\" (National Archives transcript)","sources":["tna"]},{"id":"act","title":"Rebuilding of London Act","type":"law","cluster":"rebuild","summary":"Parliament required brick or stone fronts and four set sorts of building, and widened streets, while keeping the old street plan.","start":"1667-02-08","when":"royal assent 8 February 1667 (cited as 1666 c. 8)","evidence":"\"all the outsides of all Buildings in and about the said Citty be henceforth made of Bricke or Stone\" (Act, as enacted)","details":"The statute is catalogued on legislation.gov.uk as 1666 c. 8; the royal assent date of 8 February 1667 comes from Wikipedia alone (not corroborated here). The Act also imposed a coal duty to pay for public works.","sources":["act","wiki-act","sci"]},{"id":"fire-court","title":"The Fire Court","type":"institution","cluster":"rebuild","summary":"An emergency court settled disputes between landlords and tenants over who should pay to rebuild.","start":"1667-02-27","end":"1672-09","when":"27 February 1667 to September 1672","evidence":"\"first session on 27 February 1667, and last in September 1672\" (London Museum)","sources":["lm-ins","wiki-act"]},{"id":"monument","title":"The Monument","type":"memorial","cluster":"rebuild","summary":"A fluted column near Pudding Lane that the Act ordered, as high as it is far from the bakery.","start":"1671","end":"1677","when":"built 1671 to 1677 (Science Museum: 1673 to 1679)","evidence":"\"stands 202 feet tall\" and 202 feet west of the start of the fire (The Monument)","details":"Dates differ: the Monument says it was completed in 1677; the London Fire Brigade Museum says built 1671 to 1677; the Science Museum says 1673 to 1679. Height 202 feet (Monument) versus 200 (Science Museum).","sources":["mon-faq","lfb","sci","wiki-mon","act"]},{"id":"new-pauls","title":"St Paul's rebuilt","type":"building","cluster":"rebuild","summary":"The ruined cathedral was demolished and Wren's replacement begun about nine years after the fire.","start":"1675","when":"work began about 1675 ('nine years later'); took 36 years","evidence":"\"nine years later work started on a replacement building\" (The Monument)","sources":["mon-faq","sci"]},{"id":"insurance","title":"Fire insurance begins","type":"innovation","cluster":"rebuild","summary":"The first property insurance office opened in 1680 and insurers soon employed their own brigades.","start":"1680","when":"1680","evidence":"\"in 1680 the first insurance company, the ‘Fire Office’, was set up by Nicholas Barbon\" (London Museum)","details":"By 1690, the London Museum says, one in 10 London houses was insured.","sources":["lm-ins","lfb"]}],"edges":[{"source":"farriner","target":"bakery","label":"owned","kind":"explicit","sources":["lm-fire","mon-faq"]},{"source":"great-fire","target":"bakery","label":"began at","kind":"explicit","sources":["gaz85","mon-faq"]},{"source":"bakery","target":"sep2","label":"then","kind":"explicit","sources":["pepys-02","gaz85"]},{"source":"sep2","target":"sep3","label":"then","kind":"explicit","sources":["pepys-02","pepys-03"]},{"source":"sep3","target":"sep4","label":"then","kind":"explicit","sources":["pepys-03","pepys-04"]},{"source":"sep4","target":"sep5","label":"then","kind":"explicit","sources":["pepys-04","pepys-05"]},{"source":"sep5","target":"sep6","label":"then","kind":"explicit","sources":["pepys-05","pepys-06"]},{"source":"plague","target":"great-fire","label":"preceded","kind":"explicit","sources":["rmg-fire","rmg-plague"]},{"source":"drought","target":"timber-city","label":"dried out","kind":"explicit","sources":["lfb","pepys-02"]},{"source":"timber-city","target":"sep2","label":"fuelled","kind":"explicit","sources":["lfb","pepys-02"]},{"source":"firefighting","target":"sep2","label":"could not stop","kind":"explicit","sources":["lfb","gaz85"]},{"source":"east-wind","target":"sep2","label":"drove","kind":"explicit","sources":["gaz85","pepys-02"]},{"source":"east-wind","target":"sep5","label":"had dropped by","kind":"explicit","sources":["rmg-fire","evelyn"]},{"source":"bludworth","target":"firebreaks","label":"delayed","kind":"explicit","sources":["gaz85","rmg-fire"]},{"source":"pepys","target":"bludworth","label":"carried the King's order to","kind":"explicit","sources":["pepys-02"]},{"source":"pepys","target":"royal-brothers","label":"warned","kind":"explicit","sources":["pepys-02"]},{"source":"royal-brothers","target":"firebreaks","label":"ordered","kind":"explicit","sources":["pepys-02","lm-fire"]},{"source":"firebreaks","target":"sep4","label":"turned to gunpowder on","kind":"explicit","sources":["pepys-04","lm-fire"]},{"source":"firebreaks","target":"sep5","label":"held the fire on","kind":"explicit","sources":["pepys-05","evelyn"]},{"source":"royal-brothers","target":"sep3","label":"patrolled on","kind":"explicit","sources":["pepys-03","rmg-fire"]},{"source":"pepys","target":"sep2","label":"recorded","kind":"explicit","sources":["pepys-02"]},{"source":"pepys","target":"sep3","label":"recorded","kind":"explicit","sources":["pepys-03"]},{"source":"pepys","target":"sep5","label":"recorded","kind":"explicit","sources":["pepys-05"]},{"source":"evelyn","target":"st-pauls","label":"described the fall of","kind":"explicit","sources":["evelyn"]},{"source":"gazette","target":"east-wind","label":"pointed to","kind":"explicit","sources":["gaz85"]},{"source":"gazette","target":"sep6","label":"reported a flare-up on","kind":"explicit","sources":["gaz85"]},{"source":"gazette","target":"accident","label":"concluded","kind":"explicit","sources":["gaz85"]},{"source":"gazette","target":"foreigners","label":"reported arrests of","kind":"explicit","sources":["gaz85"]},{"source":"sep4","target":"st-pauls","label":"destroyed","kind":"explicit","sources":["evelyn","rmg-fire"]},{"source":"st-pauls","target":"scale","label":"is counted in","kind":"explicit","sources":["lfb","mon-faq"]},{"source":"scale-dispute","target":"scale","label":"qualifies","kind":"explicit","sources":["gaz-note","bl-hubert","rmg-fire","sci"]},{"source":"deaths","target":"scale","label":"is the least certain part of","kind":"inferred"},{"source":"bakery","target":"deaths","label":"claimed the first reported victim in","kind":"explicit","sources":["rmg-fire","tna"]},{"source":"sep3","target":"foreigners","label":"stirred","kind":"explicit","sources":["rmg-fire"]},{"source":"pepys","target":"foreigners","label":"recorded rumours of","kind":"explicit","sources":["pepys-05"]},{"source":"foreigners","target":"hubert","label":"was the climate for","kind":"inferred"},{"source":"hubert","target":"hubert-hanged","label":"ended with","kind":"explicit","sources":["bl-hubert"]},{"source":"hubert-hanged","target":"accident","label":"carried out despite","kind":"explicit","sources":["bl-hubert"]},{"source":"farriner","target":"accident","label":"escaped blame under","kind":"explicit","sources":["lm-fire"]},{"source":"inscription","target":"accident","label":"contradicts","kind":"inferred"},{"source":"monument","target":"inscription","label":"carried","kind":"explicit","sources":["wiki-mon"]},{"source":"great-fire","target":"hollar","label":"prompted","kind":"explicit","sources":["tna"]},{"source":"hollar","target":"scale","label":"mapped the ruins of","kind":"explicit","sources":["tna","lm-fire"]},{"source":"hollar","target":"wren-plan","label":"was followed the next day by","kind":"explicit","sources":["tna","lm-wren"]},{"source":"wren-plan","target":"evelyn-plan","label":"was followed two days later by","kind":"explicit","sources":["lm-wren","sci"]},{"source":"evelyn","target":"evelyn-plan","label":"drew","kind":"explicit","sources":["lm-wren"]},{"source":"wren-plan","target":"act","label":"was set aside by","kind":"explicit","sources":["sci","wiki-act"]},{"source":"evelyn-plan","target":"act","label":"was set aside by","kind":"explicit","sources":["sci","wiki-act"]},{"source":"great-fire","target":"declaration","label":"led to","kind":"explicit","sources":["tna"]},{"source":"declaration","target":"act","label":"foreshadowed","kind":"inferred"},{"source":"act","target":"timber-city","label":"answered","kind":"explicit","sources":["act","tna"]},{"source":"act","target":"monument","label":"ordered","kind":"explicit","sources":["act","wiki-act"]},{"source":"fire-court","target":"act","label":"ran alongside","kind":"explicit","sources":["wiki-act","lm-ins"]},{"source":"monument","target":"bakery","label":"marks the site of","kind":"explicit","sources":["mon-faq"]},{"source":"st-pauls","target":"new-pauls","label":"was replaced by","kind":"explicit","sources":["mon-faq"]},{"source":"wren-plan","target":"new-pauls","label":"came from the architect of","kind":"explicit","sources":["lm-wren","tna"]},{"source":"great-fire","target":"insurance","label":"gave rise to","kind":"explicit","sources":["lm-ins","lfb"]},{"source":"insurance","target":"firefighting","label":"later funded brigades after","kind":"explicit","sources":["lm-ins"]}],"stories":[{"id":"five-days","title":"Five days, day by day","summary":"Follow the fire from a baker's oven to the last embers.","steps":["bakery","sep2","sep3","sep4","sep5","sep6"]},{"id":"why-it-spread","title":"Why it spread","summary":"A dry summer, a wooden city, a strong wind and no fire brigade made the blaze unstoppable, until the wind fell and gunpowder opened a gap.","steps":["drought","timber-city","sep2","east-wind","sep5","firebreaks","bludworth"]},{"id":"who-was-blamed","title":"Who was blamed","summary":"A frightened city looked for culprits; the official account said accident, yet a confessing man was hanged and a monument briefly blamed Catholics.","steps":["sep3","foreigners","hubert","hubert-hanged","accident","inscription"]},{"id":"rebuilding","title":"How the City was rebuilt","summary":"Grand plans arrived within days; the law, property lines and cost kept the old streets but changed the buildings.","steps":["great-fire","hollar","wren-plan","evelyn-plan","act","monument"]},{"id":"counting","title":"How many? The numbers that disagree","summary":"Even the best-known figures differ between respectable sources; here is where they diverge.","steps":["deaths","scale","scale-dispute"]},{"id":"cathedral","title":"A cathedral lost and rebuilt","summary":"From the stones that flew on Tuesday night to the replacement begun nine years later.","steps":["sep4","st-pauls","new-pauls","wren-plan"]}],"defaultView":"timeline"}</script>
<script>
(() => {
"use strict";
const story = JSON.parse(document.getElementById("story-data").textContent);
const theme = JSON.parse(document.getElementById("theme-data").textContent);
const NS = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const isNarrow = () => innerWidth <= 760;

/* ---------- tiny DOM helpers (all text goes through textContent: no HTML injection) ---------- */
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
function sv(tag, props) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(props || {})) if (v != null) e.setAttribute(k, v);
  return e;
}
const safeUrl = (u) => { try { return /^https?:$/.test(new URL(u).protocol) ? u : null; } catch { return null; } };
const cap = (s) => String(s || "").replace(/[-_]/g, " ").replace(/^./, (c) => c.toUpperCase());

/* ---------- theme ---------- */
const hex2rgb = (h) => { h = h.replace("#", ""); if (h.length === 3) h = [...h].map((x) => x + x).join(""); return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16)); };
function rgb2hsl([r, g, b]) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn; let h = 0, s = 0; const l = (mx + mn) / 2;
  if (d) { s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn); h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; }
  return [h, s, l];
}
const nClusters = story.clusters.length;
const cIndex = new Map(story.clusters.map((c, i) => [c.id, i]));
function clusterColor(id) {
  if (theme.clusters && theme.clusters[id]) return theme.clusters[id];
  const [h, s] = rgb2hsl(hex2rgb(theme.colors.accent));
  const hue = (h + cIndex.get(id) * (360 / nClusters)) % 360;
  return `hsl(${hue.toFixed(0)} ${Math.max(45, Math.min(75, s * 100)).toFixed(0)}% ${theme.mode === "dark" ? 66 : 40}%)`;
}
const colors = Object.fromEntries(story.clusters.map((c) => [c.id, clusterColor(c.id)]));
if (theme.font) {
  if (theme.font.body) document.body.style.fontFamily = theme.font.body;
  if (theme.font.display) $("wordmark").style.fontFamily = theme.font.display;
}
const wm = theme.wordmark || {};
$("wordmark").textContent = wm.text || story.title;
if (wm.letterSpacing) $("wordmark").style.letterSpacing = wm.letterSpacing;
if (wm.uppercase) $("wordmark").style.textTransform = "uppercase";
if (theme.logo && theme.logo.src) $("logo").append(el("img", { src: theme.logo.src, alt: theme.logo.alt || "" }));
$("dek").textContent = story.tagline;
$("credit").textContent = [story.disclaimer, story.credit].filter(Boolean).join(" ");

/* ---------- model ---------- */
const nodes = story.nodes.map((n) => ({ ...n, x: 0, y: 0, vx: 0, vy: 0, deg: 0, color: colors[n.cluster], isRoot: n.id === story.root }));
const byId = new Map(nodes.map((n) => [n.id, n]));
const edges = story.edges.map((e, i) => ({ ...e, i, a: byId.get(e.source), b: byId.get(e.target) }));
const adj = new Map(nodes.map((n) => [n.id, new Set()]));
for (const e of edges) { e.a.deg++; e.b.deg++; adj.get(e.source).add(e.target); adj.get(e.target).add(e.source); }
for (const n of nodes) n.r = n.isRoot ? 30 : (n.featured ? 13 : 8) + Math.min(n.deg, 8) * 0.45;
const srcById = new Map(story.sources.map((s) => [s.id, s]));
const storyById = new Map((story.stories || []).map((s) => [s.id, s]));

/* ---------- force layout (deterministic, no dependencies) ---------- */
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function layout() {
  const rnd = rng(7), N = nodes.length;
  const sector = (id) => 2 * Math.PI * (cIndex.get(id) + 0.5) / nClusters;
  const R = 330 + Math.sqrt(N) * 40;
  const asp = Math.max(0.75, Math.min(2.2, svgEl.clientWidth / Math.max(1, svgEl.clientHeight))), ax = Math.sqrt(asp), ay = 1 / ax; // fill the stage shape
  for (const n of nodes) {
    n.vx = n.vy = 0;
    if (n.isRoot) { n.x = n.y = 0; continue; }
    const ang = sector(n.cluster) + (rnd() - 0.5) * 0.9, rad = R * (0.45 + rnd() * 0.7);
    n.x = Math.cos(ang) * rad * ax; n.y = Math.sin(ang) * rad * ay;
  }
  const iters = N > 140 ? 220 : 480, XS = 0.55; // XS<1 makes horizontal crowding count more: labels are wider than tall
  for (let it = 0; it < iters; it++) {
    const alpha = Math.pow(1 - it / iters, 1.4);
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
      const a = nodes[i], b = nodes[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      if (dx * dx + dy * dy < 1) { dx = rnd() - .5; dy = rnd() - .5; }
      const wd = Math.sqrt(dx * dx * XS * XS + dy * dy) || 1, d = Math.sqrt(dx * dx + dy * dy) || 1;
      const min = a.r + b.r + 95;
      let f = 26000 / (wd * wd); if (wd < min) f += (min - wd) * 0.9;
      f *= alpha + 0.04;
      const fx = dx / d * f, fy = dy / d * f;
      a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
    }
    for (const e of edges) {
      const a = e.a, b = e.b, dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
      const L = a.cluster === b.cluster ? 150 : 250, f = (d - L) * 0.03 * (alpha + 0.1);
      const fx = dx / d * f, fy = dy / d * f; a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
    }
    for (const n of nodes) {
      if (n.isRoot) continue;
      const s = sector(n.cluster), tx = Math.cos(s) * R * ax, ty = Math.sin(s) * R * ay;
      n.vx += (tx - n.x) * 0.014 * alpha; n.vy += (ty - n.y) * 0.014 * alpha;
      n.x += n.vx * 0.6; n.y += n.vy * 0.6; n.vx *= 0.55; n.vy *= 0.55;
    }
  }
}

/* ---------- SVG build ---------- */
const svgEl = $("graph"), vp = $("vp");
for (const e of edges) {
  e.line = sv("line", { class: "edge" + (e.kind === "inferred" ? " inferred" : "") });
  e.line.append(Object.assign(sv("title"), { textContent: `${e.a.title} → ${e.b.title}: ${e.label} (${e.kind})` }));
  e.text = sv("text", { class: "edge-label" }); e.text.textContent = e.label;
  $("edges").append(e.line); $("edge-labels").append(e.text);
}
for (const n of nodes) {
  const g = sv("g", { class: "node" + (n.isRoot ? " root" : ""), tabindex: 0, role: "button", "aria-label": `${n.title}, ${cap(n.type)}, ${story.clusters[cIndex.get(n.cluster)].label}`, "data-id": n.id });
  g.append(sv("circle", { r: n.r + 11, fill: "transparent" }));
  g.append(sv("circle", { class: "ring", r: n.r + 6 }));
  g.append(sv("circle", { class: "core", r: n.r, stroke: n.color, style: n.isRoot ? "fill:" + n.color : null }));
  if (!n.isRoot) g.append(sv("circle", { class: "dot", r: Math.max(2, n.r * 0.22), fill: n.color }));
  const lab = sv("text", { class: "label", y: n.r + 15 }); lab.textContent = n.title; g.append(lab);

  if (undated > 0) { const note = sv("text", { class: "tl-tick-label", x: 14, y: total + 12, "text-anchor": "start" }); note.textContent = `${undated} of ${nodes.length} nodes have no date, so they appear only in the other views.`; svg.append(note); }
  $("tl-mode").textContent = TL.even ? "True scale" : "Even spacing";
}
(function timelineInput() {
  const svg = $("tl"); let d = null; const pts = new Map(); let pinch = 0;
  const pdist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y) || 1; };
  svg.addEventListener("wheel", (e) => { if (TL.even) return; e.preventDefault(); const r = svg.getBoundingClientRect(); tlZoom(Math.exp(e.deltaY * 0.0015), e.clientX - r.left); }, { passive: false });
  svg.addEventListener("pointerdown", (e) => {
    if (TL.even || e.button > 0) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) { pinch = pdist(); d = null; return; }
    d = { x: e.clientX, v0: TL.v0, v1: TL.v1, id: e.pointerId, moved: false };
  });
  svg.addEventListener("pointermove", (e) => {
    if (pts.has(e.pointerId)) pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2 && pinch) {
      const nd = pdist(), [a, b] = [...pts.values()], r = svg.getBoundingClientRect();
      tlZoom(pinch / nd, (a.x + b.x) / 2 - r.left); pinch = nd; return;
    }
    if (!d || e.pointerId !== d.id || !TL.geo) return;
    const dx = e.clientX - d.x;
    if (!d.moved && Math.abs(dx) > 5) { d.moved = true; try { svg.setPointerCapture(e.pointerId); } catch {} svg.style.cursor = "grabbing"; }
    if (d.moved) { const dt = -dx / TL.geo.pw * (d.v1 - d.v0); TL.v0 = d.v0 + dt; TL.v1 = d.v1 + dt; renderTimeline(); }
  });
  const end = (e) => { pts.delete(e.pointerId); if (pts.size < 2) pinch = 0; d = null; svg.style.cursor = ""; };
  svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
  $("tl-mode").onclick = () => { TL.even = !TL.even; if (!TL.even) tlReset(); renderTimeline(); };
})();

/* ----- read: guided stories as a narrative ----- */
function showStep(sid, i) { setView("graph"); startStory(sid); goStep(i); }
function renderRead() {
  const box = $("read"); box.textContent = "";
  const all = story.stories || []; if (!all.length) return;
  const st = storyById.get(S.readStory) || all[0]; S.readStory = st.id;
  const wrap = el("div", { class: "read-wrap" });
  wrap.append(el("div", { class: "read-tabs" }, all.map((s) => el("button", { class: "chip", "aria-pressed": String(s.id === st.id), text: s.title, onclick: () => { S.readStory = s.id; renderRead(); box.scrollTop = 0; } }))));
  wrap.append(el("h2", { class: "rt", text: st.title }));
  if (st.summary) wrap.append(el("p", { class: "intro", text: st.summary }));
  st.steps.forEach((id, i) => {
    const n = byId.get(id), prev = i ? byId.get(st.steps[i - 1]) : null;
    const e = prev ? edges.find((x) => (x.a === prev && x.b === n) || (x.a === n && x.b === prev)) : null;
    const srcs = (n.sources || []).map((s) => srcById.get(s)).filter(Boolean);
    wrap.append(el("section", { class: "rstep", style: `--c:${n.color}` },
      el("span", { class: "rnum", text: String(i + 1) }),
      e ? el("p", { class: "via" }, `${e.a.title} `, el("em", { text: `${e.label} →` }), ` ${e.b.title}`, e.kind === "inferred" ? " (inferred)" : "") : null,
      el("h3", null, el("button", { text: n.title, onclick: () => select(n.id) })),
      el("p", { class: "meta", text: [story.clusters[cIndex.get(n.cluster)].label, cap(n.type), n.when].filter(Boolean).join(" · ") }),
      el("p", { text: n.summary }),
      n.details ? el("p", { class: "details", text: n.details }) : null,
      n.evidence ? el("blockquote", { text: n.evidence }) : null,
      srcs.length ? el("p", { class: "rsrc" }, "Sources: ", srcs.flatMap((s, k) => { const u = safeUrl(s.url); return [k ? ", " : "", u ? el("a", { href: u, target: "_blank", rel: "noopener noreferrer", text: s.title }) : s.title]; })) : null,
      el("p", null, el("button", { class: "chip", text: "Show on graph", onclick: () => showStep(st.id, i) }))));
  });
  box.append(wrap);
}

/* ----- outline: the graph as a collapsible tree from the root ----- */
const tree = (() => {
  const nbrs = new Map(nodes.map((n) => [n.id, []]));
  for (const e of [...edges].sort((a, b) => (a.kind === "explicit" ? 0 : 1) - (b.kind === "explicit" ? 0 : 1))) { nbrs.get(e.source).push([e.target, e]); nbrs.get(e.target).push([e.source, e]); }
  const parent = new Map([[story.root, null]]), kids = new Map(nodes.map((n) => [n.id, []])), q = [story.root];
  while (q.length) { const id = q.shift(); for (const [o, e] of nbrs.get(id)) if (!parent.has(o)) { parent.set(o, { id, e }); kids.get(id).push(o); q.push(o); } }
  const treeEdges = new Set([...parent.values()].filter(Boolean).map((p) => p.e));
  return { parent, kids, treeEdges, orphans: nodes.filter((n) => !parent.has(n.id)) };
})();
S.open.add(story.root);
function renderOutline() {
  const box = $("outline"); box.textContent = "";
  const wrap = el("div", { class: "ol-wrap" });
  wrap.append(el("div", { class: "ol-tools" },
    el("button", { class: "btn", text: "Expand all", onclick: () => { nodes.forEach((n) => S.open.add(n.id)); renderOutline(); } }),
    el("button", { class: "btn", text: "Collapse all", onclick: () => { S.open.clear(); S.open.add(story.root); renderOutline(); } })));
  const item = (n) => {
    const kids = tree.kids.get(n.id), p = tree.parent.get(n.id), dim = !matches(n);
    const head = [
      el("i", { style: `--c:${n.color}` }),
      p ? el("span", { class: "via", text: `${p.e.a.id === p.id ? "→" : "←"} ${p.e.label}` }) : null,
      el("button", { class: "olt", text: n.title, onclick: (ev) => { ev.preventDefault(); ev.stopPropagation(); select(n.id); } }),
      el("small", { text: [cap(n.type), n.when].filter(Boolean).join(" · ") }),
    ];
    const also = edges.filter((e) => (e.a === n || e.b === n) && !tree.treeEdges.has(e)).slice(0, 8);
    const body = el("div", { class: "olbody" }, el("p", { text: n.summary }),
      also.length ? el("p", null, "Also: ", also.flatMap((e, k) => { const o = e.a === n ? e.b : e.a; return [k ? "  ·  " : "", el("button", { class: "olink", text: `${e.a === n ? "→" : "←"} ${e.label} ${o.title}`, onclick: () => select(o.id) })]; })) : null);
    if (!kids.length) return el("li", { class: dim ? "dim" : "" }, el("div", { class: "row" }, head), body);
    return el("li", { class: dim ? "dim" : "" },
      el("details", { open: S.open.has(n.id), ontoggle: (ev) => { if (ev.target.open) S.open.add(n.id); else S.open.delete(n.id); } },
        el("summary", { class: "row" }, head, el("span", { class: "olcount", text: String(kids.length) })), body,
        el("ul", null, kids.map((k) => item(byId.get(k))))));
  };
  wrap.append(el("ul", null, item(byId.get(story.root))));
  if (tree.orphans.length) wrap.append(el("h3", { text: "Not connected to the root", style: "margin:24px 0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)" }), el("ul", null, tree.orphans.map((n) => el("li", null, el("div", { class: "row" }, el("i", { style: `--c:${n.color}` }), el("button", { class: "olt", text: n.title, onclick: () => select(n.id) }), el("small", { text: cap(n.type) }))))));
  box.append(wrap);
}

/* ----- switching ----- */
function setView(v) {
  if (!viewList.includes(v)) v = viewList[0];
  const was = S.view; S.view = v;
  for (const key of ["list", "timeline", "read", "outline"]) $(key).classList.toggle("on", v === key);
  svgEl.style.visibility = v === "graph" ? "visible" : "hidden";
  const spatial = v === "graph" || v === "timeline";
  $("zoom").style.display = spatial ? "" : "none";
  $("zoom").classList.toggle("right", v === "timeline");
  $("btn-fit").style.display = spatial ? "" : "none";
  $("chips").style.display = v === "read" ? "none" : "";
  $("stories").style.display = spatial ? "" : "none";
  if (!spatial && S.story) endStoryQuiet();
  for (const b of $("views").children) b.setAttribute("aria-pressed", String(b.dataset.v === v));
  if (v === "read") renderRead();
  render();
  if (v === "graph" && was !== "graph") requestAnimationFrame(() => { if (!touched) fit(false); });
  if (v === "timeline") requestAnimationFrame(renderTimeline);
}

/* ---------- toolbar ---------- */
const usedClusters = new Set(nodes.map((n) => n.cluster));
$("chips").append(el("button", { class: "chip", "data-c": "all", text: "All", onclick: () => { S.filter = "all"; render(); } }));
for (const c of story.clusters) if (usedClusters.has(c.id)) $("chips").append(el("button", { class: "chip", "data-c": c.id, style: `--c:${colors[c.id]}`, onclick: () => { S.filter = S.filter === c.id ? "all" : c.id; render(); } }, el("i"), c.label));
if ((story.stories || []).length) {
  $("stories").append(el("span", { text: "Follow a story" }));
  for (const s of story.stories) $("stories").append(el("button", { class: "chip", "data-s": s.id, title: s.summary || "", text: s.title, onclick: () => (S.story && S.story.id === s.id ? endStory() : startStory(s.id)) }));
}
for (const c of story.clusters) if (usedClusters.has(c.id)) $("legend").append(el("span", { style: `--c:${colors[c.id]}` }, el("i"), c.label));
$("legend").append(el("span", { title: "Relationship directly supported by a cited source" }, (() => { const s = sv("svg", { viewBox: "0 0 22 8" }); s.append(sv("line", { x1: 0, y1: 4, x2: 22, y2: 4, stroke: "currentColor", "stroke-width": 1.5 })); return s; })(), "sourced"));
$("legend").append(el("span", { title: "Editorial bridge: an interpretation, not a direct claim" }, (() => { const s = sv("svg", { viewBox: "0 0 22 8" }); s.append(sv("line", { x1: 0, y1: 4, x2: 22, y2: 4, stroke: "currentColor", "stroke-width": 1.5, "stroke-dasharray": "3 4" })); return s; })(), "inferred"));

$("views").append(...viewList.map((v) => el("button", { "data-v": v, "aria-pressed": "false", text: VIEW_LABEL[v], onclick: () => setView(v) })));
if (viewList.length < 2) $("views").style.display = "none";
$("q").addEventListener("input", (e) => { S.q = e.target.value.trim().toLowerCase(); render(); });
$("btn-fit").onclick = () => { if (S.view === "timeline") { tlReset(); renderTimeline(); } else fit(); };
$("btn-reset").onclick = () => { S.filter = "all"; S.q = ""; $("q").value = ""; endStoryQuiet(); tlReset(); layout(); place(); select(null); fit(); };
/* Full screen: only offered where the browser supports it and the page is not embedded (an embedding page, like the product site, has its own button). */
(() => {
  const btn = $("btn-fs"), root = document.documentElement;
  const request = root.requestFullscreen || root.webkitRequestFullscreen;
  const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  let embedded = false; try { embedded = window.self !== window.top; } catch { embedded = true; }
  if (!request || document.fullscreenEnabled === false || embedded) return;
  const sync = () => { btn.textContent = isFs() ? "Exit full screen" : "Full screen"; btn.setAttribute("aria-pressed", String(isFs())); };
  const toggle = () => { if (isFs()) (document.exitFullscreen || document.webkitExitFullscreen).call(document); else { const r = request.call(root); if (r && r.catch) r.catch(() => {}); } };
  btn.hidden = false; btn.onclick = toggle; sync();
  document.addEventListener("fullscreenchange", sync); document.addEventListener("webkitfullscreenchange", sync);
  addEventListener("keydown", (e) => { if ((e.key === "f" || e.key === "F") && !e.ctrlKey && !e.metaKey && !e.altKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) { e.preventDefault(); toggle(); } });
})();
$("zin").onclick = () => (S.view === "timeline" ? tlZoom(1 / 1.4, (TL.geo ? TL.geo.x0 + TL.geo.pw / 2 : 0)) : zoomAt(1.3, svgEl.clientWidth / 2, svgEl.clientHeight / 2));
$("zout").onclick = () => (S.view === "timeline" ? tlZoom(1.4, (TL.geo ? TL.geo.x0 + TL.geo.pw / 2 : 0)) : zoomAt(1 / 1.3, svgEl.clientWidth / 2, svgEl.clientHeight / 2));
$("sb-prev").onclick = () => goStep(S.step - 1); $("sb-next").onclick = () => goStep(S.step + 1); $("sb-exit").onclick = endStory;
addEventListener("keydown", (e) => {
  const typing = e.target.tagName === "INPUT";
  if (e.key === "/" && !typing) { e.preventDefault(); $("q").focus(); }
  else if (e.key === "Escape") { if (typing) e.target.blur(); else if (S.selected) select(null); else if (S.story) endStory(); }
  else if (S.story && !typing && e.key === "ArrowRight") goStep(S.step + 1);
  else if (S.story && !typing && e.key === "ArrowLeft") goStep(S.step - 1);
});

/* ---------- pointer interaction: pan, zoom, pinch, drag nodes ---------- */
const ptrs = new Map(); let drag = null;
const toWorld = (cx, cy) => { const r = svgEl.getBoundingClientRect(); return [(cx - r.left - view.x) / view.k, (cy - r.top - view.y) / view.k]; };
const pinchInfo = () => { const [a, b] = [...ptrs.values()]; return { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; };
svgEl.addEventListener("pointerdown", (e) => {
  cancelAnimationFrame(tweenId);
  svgEl.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2) { drag = { type: "pinch", ...pinchInfo() }; return; }
  const g = e.target.closest && e.target.closest(".node");
  drag = g ? { type: "node", n: byId.get(g.dataset.id), sx: e.clientX, sy: e.clientY, moved: false }
           : { type: "pan", sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, moved: false };
});
svgEl.addEventListener("pointermove", (e) => {
  if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!drag) return;
  if (drag.type === "pinch" && ptrs.size === 2) {
    const p = pinchInfo(), r = svgEl.getBoundingClientRect();
    zoomAt(p.d / drag.d, p.mx - r.left, p.my - r.top); view.x += p.mx - drag.mx; view.y += p.my - drag.my; applyView(); drag = { type: "pinch", ...p }; return;
  }
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.moved && Math.hypot(dx, dy) > 4) { drag.moved = true; svgEl.classList.add("dragging"); }
  if (!drag.moved) return;
  if (drag.type === "pan") { view.x = drag.vx + dx; view.y = drag.vy + dy; applyView(); }
  else if (drag.type === "node") { const [wx, wy] = toWorld(e.clientX, e.clientY); drag.n.x = wx; drag.n.y = wy; place(); }
});
const endPtr = (e) => {
  ptrs.delete(e.pointerId); svgEl.classList.remove("dragging");
  if (drag && drag.type !== "pinch" && !drag.moved) { if (drag.type === "node") select(drag.n.id, { center: false }); else if (S.selected && !S.story) select(null); }
  if (ptrs.size < 2) drag = null;
};
svgEl.addEventListener("pointerup", endPtr); svgEl.addEventListener("pointercancel", endPtr);
svgEl.addEventListener("wheel", (e) => { e.preventDefault(); const r = svgEl.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
let sized = svgEl.clientWidth > 0 && svgEl.clientHeight > 0, touched = false;
svgEl.addEventListener("pointerdown", () => { touched = true; }); svgEl.addEventListener("wheel", () => { touched = true; }, { passive: true });
const onSize = () => {
  if (S.view === "timeline") { renderTimeline(); return; }
  if (S.view !== "graph" || !svgEl.clientWidth || !svgEl.clientHeight) return;
  if (!sized) { sized = true; layout(); place(); fit(false); return; } // first real size (page was loaded hidden / zero-sized)
  if (!touched && !S.selected && !S.story) fit(false);
};
if (window.ResizeObserver) { new ResizeObserver(onSize).observe(svgEl); new ResizeObserver(() => { if (S.view === "timeline") renderTimeline(); }).observe($("timeline")); } else addEventListener("resize", onSize);

/* ---------- boot ---------- */
layout(); place(); setView(viewList.includes(story.defaultView) ? story.defaultView : "graph"); fit(false);
function fromHash() {
  const p = new URLSearchParams(location.hash.replace(/^#/, ""));
  if (p.has("view") && S.view !== p.get("view")) setView(p.get("view"));
  if (p.has("story") && storyById.has(p.get("story")) && !(S.story && S.story.id === p.get("story"))) startStory(p.get("story"));
  else if (p.has("node") && byId.has(p.get("node")) && S.selected !== p.get("node")) select(p.get("node"), { center: true });
}
addEventListener("hashchange", fromHash);
fromHash();
})();
